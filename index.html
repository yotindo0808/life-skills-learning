4:45"],"answer":1,"answerText":"13:30","type":"listen","answerType":"sentence","spoken":null,"clip":"小安今天13:15要報到。活動在13:30開始。","segment":2},{"id":"W2D7-D3","stem":"小安從哪裡進入？","options":["地下室","停車場","正門"],"answer":2,"answerText":"正門","type":"listen","answerType":"sentence","spoken":null,"clip":"小安帶了鉛筆盒來活動中心。他從正門進入大樓。","segment":3},{"id":"W2D7-D4","stem":"活動結束後先做什麼？","options":["丟掉紙本","檢查自己的物品","直接離開"],"answer":1,"answerText":"檢查自己的物品","type":"listen","answerType":"sentence","spoken":null,"clip":"活動在14:45結束。小安要先檢查自己的物品，再離開教室。","segment":4}],"E":[{"id":"W2D7-E1","stem":"活動時間有變動，小安先做什麼？","options":["只記原來的時間","不看資訊就出發","看新的活動通知"],"answer":2,"answerText":"看新的活動通知","type":"judgment","answerType":"short","spoken":null},{"id":"W2D7-E2","stem":"找不到教室時，哪一種做法合適？","options":["在走廊隨便猜","跟著不認識的人離開","向服務台詢問"],"answer":2,"answerText":"向服務台詢問","type":"judgment","answerType":"short","spoken":null},{"id":"W2D7-E3","stem":"遇到看不懂的題目，可以怎麼做？","options":["亂寫一個答案","把整份作業丟掉","先跳過，接著做下一題"],"answer":2,"answerText":"先跳過，接著做下一題","type":"judgment","answerType":"short","spoken":null},{"id":"W2D7-E4","stem":"工作人員講話太快，小安可以怎麼做？","options":["請對方說慢一點","一直猜意思","不聽就走"],"answer":0,"answerText":"請對方說慢一點","type":"judgment","answerType":"short","spoken":null},{"id":"W2D7-E5","stem":"活動開始時間和報到時間不同，小安應該看哪一項？","options":["不用看任何時間","看報到時間","只看結束時間"],"answer":1,"answerText":"看報到時間","type":"judgment","answerType":"short","spoken":null},{"id":"W2D7-E6","stem":"平板沒電，無法查看行程，應該怎麼做？","options":["隨便猜時間","尋求適當協助","直接不去活動"],"answer":1,"answerText":"尋求適當協助","type":"judgment","answerType":"short","spoken":null}],"F":[{"id":"W2D7-F1","label":"活動名稱","target":"生活資訊課"},{"id":"W2D7-F2","label":"開始時間","target":"13:30"},{"id":"W2D7-F3","label":"活動地點","target":"一樓多功能教室"},{"id":"W2D7-F4","label":"詢問句","target":"請問教室在哪裡？"},{"id":"W2D7-F5","label":"求助句","target":"可以再說一次嗎？"}]}}]};
// 教師開放設定只讀取 GitHub Pages 上的公開 JSON 檔。
// 家長與學生沒有網站內修改入口；修改檔案需 GitHub 儲存庫寫入權限。
// 靜態網站不能防止使用者閱讀公開原始碼，這裡的鎖定限於一般操作介面。
const DEFAULT_COURSE={week2:false,maxDay1:1,maxDay2:1,help:'classroom',seq:true,speed:.85};
let courseSettings={...DEFAULT_COURSE};
let courseStatus='loading';
const STUDENT_STORAGE='life-w1w2-student-v1';
const app=document.getElementById('app');
let state={progress:{},typing:{}};
try{
 const old=JSON.parse(localStorage.getItem(STUDENT_STORAGE)||localStorage.getItem('life-w1w2-rebuild')||'{}');
 state.progress=old.progress&&typeof old.progress==='object'&&!Array.isArray(old.progress)?old.progress:{};
 state.typing=old.typing&&typeof old.typing==='object'&&!Array.isArray(old.typing)?old.typing:{};
 localStorage.setItem(STUDENT_STORAGE,JSON.stringify(state));
 // 清除舊版存在平板的教師 PIN 與本機解鎖設定，保留已移轉的學習紀錄。
 localStorage.removeItem('life-w1w2-rebuild');
}catch(e){console.warn('此環境無法讀取本機學習紀錄')}
let view={mode:'home',week:1,day:1,section:'A',index:0,wrong:false,selected:null};const sectionList=['A','B','C','D','E','F'];const labels={A:'閱讀與書寫',B:'看圖算錢',C:'對話與表達',D:'分段聆聽',E:'生活判斷',F:'平板打字'};
function save(){try{localStorage.setItem(STUDENT_STORAGE,JSON.stringify(state))}catch(e){console.warn('此環境無法保存本機紀錄')}}
function canOpen(w,d){return Number.isInteger(d)&&d>=1&&d<=7&&(w===1?d<=courseSettings.maxDay1:w===2&&courseSettings.week2&&d<=courseSettings.maxDay2)}
function parseCourseSettings(value){
 if(!value||typeof value!=='object'||Array.isArray(value))throw Error('教師設定格式錯誤');
 if(typeof value.week2!=='boolean'||!Number.isInteger(value.maxDay1)||value.maxDay1<1||value.maxDay1>7||!Number.isInteger(value.maxDay2)||value.maxDay2<1||value.maxDay2>7)throw Error('教師開放週次與天數設定錯誤');
 if(!['classroom','routine'].includes(value.help)||typeof value.seq!=='boolean'||typeof value.speed!=='number'||value.speed<.5||value.speed>1.2)throw Error('教師教學設定錯誤');
 return {week2:value.week2,maxDay1:value.maxDay1,maxDay2:value.maxDay2,help:value.help,seq:value.seq,speed:value.speed};
}
async function refreshCourseSettings(){
 try{
  const r=await fetch('./course-config.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('無法取得教師設定，HTTP '+r.status);
  courseSettings=parseCourseSettings(await r.json());
  courseStatus='ok';
 }catch(e){
  // 無法取得教師設定時，不沿用任何裝置的舊教師權限，僅保留預設第 1 週第 1 天。
  courseSettings={...DEFAULT_COURSE};courseStatus='offline';console.warn('讀取教師設定失敗',e);
 }
 if(view.mode==='practice'&&!canOpen(view.week,view.day))view.mode='home';
 render();
}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dayData(w,d){let a= w===2 && courseSettings.help!=='routine' ? BANK.week2_wait:BANK.days;return a.find(t=>t.week===w&&t.day===d)}
function speak(s){if(!('speechSynthesis' in window)){alert('此瀏覽器沒有提供語音朗讀功能');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(s));u.lang='zh-TW';u.rate=courseSettings.speed||.85; speechSynthesis.speak(u)}
function voice(txt){return `<button type="button" title="聽語音" onclick="speak(decodeURIComponent('${encodeURIComponent(txt)}'))">🔊 聽一遍</button>`}
function goHome(){view.mode='home';render()}
function start(w,d,s='A'){if(!canOpen(w,d)){alert('這一天尚未開放');return}if(courseSettings.seq&&!['A','D','F'].includes(s)){let before=sectionList.slice(0,sectionList.indexOf(s)).filter(x=>!['D','F'].includes(x));if(before.some(x=>!(state.progress[`W${w}D${d}-${x}`]||{}).done)){alert('請先完成前面的核心活動；紙本聆聽與打字可單獨開啟。');return}}view={mode:'practice',week:w,day:d,section:s,index:0,wrong:false,selected:null};render()}
function progressKey(){return `W${view.week}D${view.day}-${view.section}`}
function qs(){return dayData(view.week,view.day).sections[view.section]}
function one(){return qs()[view.index]}
function showHome(){
 let notice=courseStatus==='offline'?'<p class="warning">目前無法更新教師開放設定，只能練習第 1 週第 1 天。請確認網路後重新開啟網站。</p>':'';
 let html=`<section class="card"><h1>每天固定的學習</h1><div class="step">☑ 現在要做什麼：選擇這週的練習。 ${voice('選擇這週的練習')}</div><p>每天照 A、B、C、D、E、F 的順序練習。遇到不會的題目，可以先跳過。</p>${notice}<p class="muted">開放的週次與天數由教師統一設定，學生與家長無須設定密碼。</p></section>`;
 for(let w of [1,2]){
  html+=`<section class="card"><h2>第 ${w} 週｜${w===1?'小安去活動中心':'小安在活動中心求助'} ${w===2&&!courseSettings.week2?'<span class="pill">教師尚未開放</span>':''}</h2><div class="tiles">`;
  for(let d=1;d<=7;d++){
   let data=dayData(w,d);
   html+=`<button class="tile" ${!canOpen(w,d)?'disabled':''} onclick="start(${w},${d})"><b>第 ${d} 天</b><div class="muted">${esc(data.story.activity)} · ${esc(data.story.start)}</div></button>`;
  }
  html+='</div></section>'
 }
 return html
}
function storyBox(d){let s=d.story;return `<div class="intro"><strong>活動通知（練習資料）</strong><div>活動：${esc(s.activity)}　地點：${esc(s.room)}</div><div>報到：${s.register}　開始：${s.start}　結束：${s.end}</div><div>入口：${esc(s.entrance)}　攜帶：${esc(s.item)}　詢問處：服務台</div><div>${d.week===2?'狀況：'+esc(s.issue):'活動結束後：先檢查自己的物品'}</div></div>`}
function svgIcon(name){let data={'水瓶':'<rect x="23" y="19" width="24" height="34" rx="7"/><rect x="30" y="12" width="10" height="7"/><path d="M27 37h16"/>','果汁':'<rect x="23" y="19" width="24" height="34" rx="7"/><rect x="30" y="12" width="10" height="7"/>','飯糰':'<path d="M35 10L15 53H55Z"/><rect x="30" y="38" width="10" height="15"/>','筆記本':'<rect x="15" y="9" width="40" height="49"/><path d="M24 23h21M24 33h21"/>','口罩':'<rect x="15" y="21" width="40" height="27" rx="6"/><path d="M19 32h32M15 30H5M55 30h10"/>','麵包':'<rect x="12" y="20" width="46" height="30" rx="13"/><path d="M31 24l-3 17"/>','資料夾':'<path d="M12 55V14h18l7 8h21v33z"/>','袋子':'<path d="M14 26h42v31H14zM25 27C25 4 45 4 45 27"/>'}[name]||'<circle cx="35" cy="35" r="25"/>';return `<svg viewBox="0 0 70 70" aria-label="${esc(name)}" style="fill:none;stroke:#247178;stroke-width:2.5">${data}</svg>`}
function sectionHelp(){return {A:'看通知，選答案，再把完整句子寫在紙本。',B:'看圖和價格，用計算機算出答案。',C:'看情境，選合適的回應，並寫在紙本。',D:'先聽一小段，再回答一題。',E:'看情境，選合適的做法，寫在紙本。',F:'照著題目的文字，在下方打字。'}[view.section]}
function renderPractice(){let d=dayData(view.week,view.day),s=view.section,q=one(),p=state.progress[progressKey()]||{tried:{},correct:0,done:false};let html=`<section class="card"><div class="toolbar"><button onclick="goHome()">返回首頁</button><span class="pill">第 ${view.week} 週　第 ${view.day} 天</span></div><div class="step">☑ 現在要做什麼：${sectionHelp()} ${voice(sectionHelp())}</div><div class="activitylist">${sectionList.map(x=>`<button class="${x===s?'active':''}" onclick="start(${view.week},${view.day},'${x}')">${x} ${labels[x]}</button>`).join('')}</div></section><section class="card"><div class="muted">${s} 區　第 ${view.index+1} / ${qs().length} 題</div><h2>${labels[s]}</h2>`;
 if(s==='A')html+=storyBox(d);
 if(s==='C')html+=`<div class="intro">${esc(q.context)}</div>`;
 if(s==='D')html+=`<div class="intro"><strong>▶ 第 ${q.segment} 段</strong><p>先聽這一段，再回答下面一題。</p><button class="primary" onclick="speak(decodeURIComponent('${encodeURIComponent(q.clip)}'))">🔊 播放第 ${q.segment} 段</button></div>`;
 if(s==='F'){let value=(state.typing||{})[q.id]||'';html+=`<p><b>${esc(q.label)}</b></p><div class="question">${esc(q.target)} ${voice(q.target)}</div><div class="field"><label>請在這裡打字</label><input id="typeResponse" type="text" value="${esc(value)}" autocomplete="off" aria-label="打字答案" /></div><div class="toolbar"><button class="primary" onclick="checkType()">核對文字</button><button onclick="skipQuestion()">下一項</button></div></section>`;return html}
 if(s==='B'){html+=`<div class="mathpic">${svgIcon(q.icon)}<div><div class="question">${esc(q.description)}</div><strong>${esc(q.expression)} = ______ 元</strong></div></div><div class="field"><label>計算機算出多少元？</label><input id="numberResponse" inputmode="numeric" type="number" placeholder="在這裡輸入數字"></div><div class="toolbar"><button class="primary" onclick="checkNumber()">核對答案</button><button onclick="skipQuestion()">先跳過</button></div></section>`;return html}
 html+=`<div class="question">${esc(q.stem)} ${voice(q.stem)}</div><div class="answers">${q.options.map((v,j)=>`<div style="display:flex;gap:6px"><button style="flex:1" onclick="pick(${j})">${j+1}. ${esc(v)}</button>${voice(v)}</div>`).join('')}</div><div class="toolbar"><button onclick="skipQuestion()">先跳過</button></div></section>`;return html}
function voiceForOption(txt){return ''} // one fixed speaker for stem; user can invoke speaker by tapping separate button
function mark(ok){let k=progressKey(),p=state.progress[k]||{tried:{},correct:0,done:false};let id=one().id;if(!(id in p.tried)){p.tried[id]=ok;if(ok)p.correct++}p.last=Date.now();state.progress[k]=p;save();return p}
function nextQuestion(){view.index++;view.wrong=false;view.selected=null;if(view.index>=qs().length){let p=state.progress[progressKey()]||{tried:{},correct:0};p.done=true;p.star=p.correct/qs().length>=.9?3:p.correct/qs().length>=.6?2:1;state.progress[progressKey()]=p;save();view.mode='finished';render()}else render()}
function skipQuestion(){mark(false);nextQuestion()}
function pick(j){let q=one(),ok=j===q.answer;mark(ok);if(ok){let finished=(view.section==='A'?q.stem.replace('（　）',q.answerText):q.answerText);app.innerHTML=`<section class="card"><div class="step">☑ 現在要做什麼：讀一次正確答案。 ${voice(finished)}</div><h2>答對了</h2><p class="question">${esc(finished)}</p><button class="primary" onclick="nextQuestion()">下一題</button></section>`}else {app.insertAdjacentHTML('beforeend',`<section class="card warning">再看看題目或通知，可以再選一次。<button onclick="render()">重新看題目</button></section>`)}}
function checkNumber(){let v=document.getElementById('numberResponse').value,ok=v!==''&&Number(v)===one().answer;mark(ok);if(ok){app.innerHTML=`<section class="card"><h2>答對了</h2><p>答案：${one().answer} 元</p><button class="primary" onclick="nextQuestion()">下一題</button></section>`}else alert('再按計算機確認一次。')}
function checkType(){let v=document.getElementById('typeResponse').value.trim();state.typing=state.typing||{};state.typing[one().id]=v;save();let ok=v.replace(/\s/g,'')===one().target.replace(/\s/g,'');mark(ok);if(ok){app.innerHTML=`<section class="card"><h2>文字輸入完成</h2><button class="primary" onclick="nextQuestion()">下一項</button></section>`}else alert('與題目的文字不同。可以再確認，或選「下一項」。')}
function finished(){let p=state.progress[progressKey()]||{correct:0,star:1};let idx=sectionList.indexOf(view.section);return `<section class="card"><h2>${view.section} 區完成</h2><p class="stars">${'★'.repeat(p.star||1)}${'☆'.repeat(3-(p.star||1))}</p><p>第一次答對 ${p.correct} / ${qs().length} 題。星星只代表這一次的練習，不等於能力已完全熟練。</p><div class="toolbar"><button class="primary" onclick="${idx<5?`start(${view.week},${view.day},'${sectionList[idx+1]}')`:'goHome()'}">${idx<5?'前往下一區':'今天完成，返回首頁'}</button></div></section>`}
function render(){
 app.innerHTML=view.mode==='home'?showHome():view.mode==='practice'?renderPractice():finished();
}
app.innerHTML='<section class="card"><h1>生活自立學習站</h1><p>正在讀取教師開放設定……</p></section>';
refreshCourseSettings();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCourseSettings()});
window.addEventListener('focus',()=>refreshCourseSettings());
</script></body></html>
