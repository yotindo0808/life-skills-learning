<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>生活自立學習站</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/bpmf-iansui@5.3.1/index.css" rel="stylesheet">
<style>
/* 大吉學習站｜首頁：列出學生會用到的所有頁面。清單在 pages.json */
:root{color-scheme:light;--bg:#fbfaf7;--ink:#1f2430;--muted:#5b6170;--left:#e3eef7;--line:#d5dbe3;--accent:#e8772e;--ok:#2f7d5b;--help:#3a6fb0;--warn:#fff4e5}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.5 "Bpmf Iansui","Noto Sans TC","PingFang TC",sans-serif;-webkit-user-select:none;user-select:none}
.app{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:72px 1fr auto}
.top{display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);background:#fff}
.top h1{margin:0;font-size:28px;font-weight:400;-webkit-text-stroke:.3px var(--ink)}
.today{margin-left:auto;font-size:20px;color:var(--muted)}
.main{padding:22px 24px 30px;display:grid;gap:22px;align-content:start;max-width:1200px;width:100%;margin:0 auto}
h2{margin:0 0 10px;font-size:22px;font-weight:400;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
a.card{display:flex;gap:18px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 22px;min-height:120px;touch-action:manipulation}
a.card:active{transform:scale(.98)}
a.card:focus-visible{outline:4px solid var(--help);outline-offset:3px}
a.card.fixed{background:var(--left);border-color:#b9cfe2}
a.card.new{border-color:var(--accent)}
.ic{flex:none;width:76px;height:76px;border-radius:20px;display:grid;place-items:center;font-size:40px;background:#fff;border:2px solid var(--line)}
.no{flex:none;width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:"Noto Sans TC",sans-serif;line-height:1.1;text-align:center}
.no small{display:block;font-size:14px;opacity:.8}
.no b{font-size:32px}
.t{font-size:27px;line-height:1.35;-webkit-text-stroke:.3px var(--ink)}
.d{font-size:19px;color:var(--muted);line-height:1.45;margin-top:2px}
.date{font-family:"Noto Sans TC",sans-serif;font-size:16px;color:var(--muted)}
.badge{font-family:"Noto Sans TC",sans-serif;font-size:15px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:3px}
.badge.td{background:var(--ok)}
.foot{padding:10px 24px 18px;text-align:center;font-family:"Noto Sans TC",sans-serif;font-size:14px;color:#9aa0aa}
.foot a{color:#9aa0aa}
.err{font-family:"Noto Sans TC",sans-serif;font-size:16px;color:#8a4b10;background:var(--warn);border-radius:12px;padding:8px 14px}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1 id="hello">我的學習站</h1><div class="today" id="today"></div></header>
  <main class="main">
    <section><h2>每次都可以做</h2><div class="grid" id="fixed"></div></section>
    <section><h2>上課的頁面</h2><div class="grid" id="lessons"></div></section>
    <div id="err"></div>
  </main>
  <footer class="foot">練習用網站，不會上傳作答。<a href="./old-course/">舊版首頁</a></footer>
</div>
<script>
/* 讀不到 pages.json 時使用的備份清單（內容和 pages.json 相同） */
const FALLBACK={"fixed":[{"title":"數學小站","desc":"每次三題：先看清楚，再想一想，最後才算。","href":"./math/","icon":"🧮"}],
 "lessons":[{"no":1,"date":"2026-11-24","title":"聽故事、說回來","desc":"聽一句說一句，聽故事，找出答案在哪一句。","href":"./lesson-2026-11-24/"},
  {"no":2,"date":"2026-11-26","title":"聽清楚、說清楚","desc":"量詞練習，再聽故事一，聽故事二。","href":"./lesson-2026-11-26/"}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=h=>/^\.\/[a-z0-9][a-z0-9\-]*\/$/.test(String(h))?h:null;
let NAME='大吉';try{NAME=localStorage.getItem('daji-name')||'大吉'}catch(e){}
const WK='日一二三四五六';
const d=new Date(),z=n=>String(n).padStart(2,'0'),TODAY=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
$('hello').textContent=`${NAME}的學習站`;
$('today').textContent=`今天：${d.getMonth()+1} 月 ${d.getDate()} 日（${WK[d.getDay()]}）`;
const md=s=>{const p=String(s).split('-');if(p.length<3)return '';const t=new Date(+p[0],+p[1]-1,+p[2]);return `${+p[1]}/${+p[2]}（${WK[t.getDay()]}）`};
function draw(data){
 const fixed=(data.fixed||[]).filter(x=>safe(x.href));
 const les=(data.lessons||[]).filter(x=>safe(x.href)).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.no-a.no));
 $('fixed').innerHTML=fixed.map(x=>`<a class="card fixed" href="${safe(x.href)}"><span class="ic">${esc(x.icon||'⭐')}</span><span><div class="t">${esc(x.title)}</div><div class="d">${esc(x.desc)}</div></span></a>`).join('');
 const newest=les.length?les[0].date:'';
 $('lessons').innerHTML=les.map(x=>{const isToday=x.date===TODAY,isNew=x.date===newest;
  return `<a class="card ${isNew?'new':''}" href="${safe(x.href)}"><span class="no"><span><small>第</small><b>${esc(x.no)}</b><small>堂</small></span></span><span><div class="date">${esc(md(x.date))}${isToday?'<span class="badge td">今天</span>':isNew?'<span class="badge">最新</span>':''}</div><div class="t">${esc(x.title)}</div><div class="d">${esc(x.desc)}</div></span></a>`}).join('')||'<div class="d">還沒有課程頁面。</div>'}
draw(FALLBACK);
fetch('./pages.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(draw).catch(()=>{if(location.protocol!=='file:')$('err').innerHTML='<div class="err">頁面清單讀取失敗，先顯示備份清單。</div>'});
</script>
</body>
</html>
