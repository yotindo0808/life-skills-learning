function mathData(q){
 const m=q.expression.match(/^(\d+)\s*([×+])\s*(\d+)$/);
 if(!m)return {prompt:q.description,options:[q.expression],correct:0};
 const a=Number(m[1]),op=m[2],b=Number(m[3]);
 let prompt=q.description;
 let match=q.description.match(/^(.+?)\s+(\d+)\s*元\s*×\s*(\d+)\s*(\S+)$/);
 if(match)prompt=`${match[1]}每${match[4].replace(/^個|^瓶|^本|^包/,'$&')} ${match[2]} 元，買 ${match[3]} ${match[4]}，總共多少元？`;
 else {
  match=q.description.match(/^(.+?)\s+(\d+)\s*元\s*[＋+]\s*(.+?)\s+(\d+)\s*元$/);
  if(match)prompt=`${match[1]} ${match[2]} 元，${match[3]} ${match[4]} 元，各買一份，共要付多少元？`;
 }
 // 同樣有加法與乘法，先判斷應用情境，而不是按現成算式。
 const ordered=[`${a} + ${b}`,`${a} × ${b}`,`${a} - ${b}`];
 const rotates=Number((q.id.match(/\d+$/)||['1'])[0])%3;
 const options=ordered.slice(rotates).concat(ordered.slice(0,rotates));
 return {prompt,options,correct:options.findIndex(v=>v===`${a} ${op} ${b}`)};
}

 const node=document.getElementById('mathReasonNumber');if(!node||node.value.trim()===''){alert('請先輸入金額。');return;}
 const q=one();mathInput=node.value.trim();
 if(Number(mathInput)!==q.answer){mathFirstNumberCorrect=false;mark(false);alert('金額不同。請再次確認計算機的結果。');return;}
 mathStage='reason';render();
}
function chooseMathReason(i){
 const q=one(),selected=reasonChoices(q)[i];const right=selected===q.reason;
 if(!right){mark(false);let node=document.getElementById('mathStatus');if(node)node.textContent='再想一想：這個題目是在計算相同商品、不同商品，還是找零？';return;}
 const correct=mathFirstMethodCorrect&&mathFirstNumberCorrect;
 mark(correct);mathDone(`算式：${q.expression}；答案：${q.answer} 元。${q.reason}`);
}
function chooseBanknote(v){
 const q=one();const right=Number(v)===q.answer;
 if(!right){mark(false);let node=document.getElementById('mathStatus');if(node)node.textContent='請選金額最小、但足夠付款的一張鈔票。';return;}
 mark(true);mathDone(`足夠付款的最小面額是 ${q.answer} 元。`);
}
function mathDone(text){
 app.innerHTML=`<section class="card"><h2>完成這一題</h2><p class="question">${esc(text)}</p>${voice(text,'🔊 聽解說')}<div class="toolbar"><button class="primary" onclick="nextQuestion()">下一題</button></div></section>`;
}
function renderSecondWeekMath(q){
 let html=`<div class="math-word-problem">${esc(q.question)}<div>${voice(q.question,'🔊 聽數學情境')}</div></div>${mathVisual2(q)}`;
 if(q.method==='付款'){
  html+=`<p class="math-subhead">請選出金額最小、但足夠付款的一張鈔票</p><div class="math-options">${[100,500,1000].map(v=>`<button onclick="chooseBanknote(${v})">${v} 元</button>`).join('')}</div><p class="progress-note" id="mathStatus" aria-live="polite"></p>`;
 }else if(mathStage==='method'){
  html+=`<p class="math-subhead">第一步：這個情境適合用哪一種方法？</p><div class="math-options">${methodChoices().map(v=>`<button onclick="chooseMathMethod('${v}')">${v}</button>`).join('')}</div><p id="mathStatus" class="progress-note" aria-live="polite">先判斷方法，不急著按計算機。</p>`;
 }else if(mathStage==='amount'){
  html+=`<p class="math-subhead">第二步：用計算機算出答案</p><div class="step">${esc(q.expression)} = ？元　${voice(q.expression)}</div><div class="field"><label>答案（元）</label><input id="mathReasonNumber" type="number" inputmode="numeric" placeholder="輸入數字"></div><button class="primary" onclick="checkReasonMath()">核對金額</button>`;
 }else {
  html+=`<p class="math-subhead">第三步：為什麼這樣算？</p><div class="math-options">${reasonChoices(q).map((v,i)=>`<button onclick="chooseMathReason(${i})">${esc(v)}</button>`).join('')}</div><p id="mathStatus" class="progress-note" aria-live="polite"></p>`;
 }
 return html+`<div class="toolbar"><button onclick="skipQuestion()">先跳過</button></div>`;
}
function renderPractice(){
 const d=dayData(view.week,view.day),s=view.section,q=one();
 let html=`<section class="card"><div class="toolbar"><button onclick="openDay(${view.week},${view.day})">A～F 區塊選單</button><button onclick="goHome()">返回首頁</button><span class="pill">第 ${view.week} 週　第 ${view.day} 天</span></div><div class="step">☑ ${sectionHelp()} ${voice(sectionHelp())}</div><div class="activitylist">${sectionList.map(x=>`<button class="${x===s?'active':''}" onclick="start(${view.week},${view.day},'${x}')">${x} ${labels[x]}</button>`).join('')}</div></section><section class="card"><div class="muted">${s} 區　第 ${view.index+1} / ${qs().length} 題</div><h2>${labels[s]}</h2>`;
 if(s==='A')html+=storyBox(d);
 if(s==='C'){
  html+=`<div class="context-cue"><span class="context-label">生活情境（先讀這段）</span>${esc(q.context)}<div>${voice(q.context,'🔊 聽生活情境')}</div></div>`;
  html+=`<div class="voice-mode"><button class="${conversationMode==='tap'?'active':''}" onclick="setConversationMode('tap')">第一層：點選作答</button><button class="${conversationMode==='speech'?'active':''}" onclick="setConversationMode('speech')">第二層：語音回答</button></div>`;
 }
 if(s==='D')html+=`<div class="intro"><strong>▶ 第 ${q.segment} 段</strong><p>先聽這一段，再回答下面一題。</p><button class="primary" onclick="speak(decodeURIComponent('${encodeURIComponent(q.clip)}'))">🔊 播放第 ${q.segment} 段</button></div>`;
 if(s==='F'){
  const value=(state.typing||{})[q.id]||'';
  html+=`<p><b>${esc(q.label)}</b></p><div class="question">${esc(q.target)} ${voice(q.target)}</div><div class="field"><label>請在這裡打字</label><input id="typeResponse" type="text" value="${esc(value)}" autocomplete="off" aria-label="打字答案" /></div><div class="toolbar"><button class="primary" onclick="checkType()">核對文字</button><button onclick="skipQuestion()">下一項</button></div></section>`;
  return html;
 }
 if(s==='B'){
  if(q.type==='math_reason'){
   html+=renderSecondWeekMath(q)+'</section>';
   return html;
  }
  const m=mathData(q);
  html+=`<div class="mathpic">${svgIcon(q.icon)}<div class="math-description">${esc(m.prompt)} ${voice(m.prompt)}</div></div>`;
  if(!mathReady)html+=`<p><strong>第一步：哪一個算式符合購物情境？</strong></p><div class="math-options">${m.options.map((option,j)=>`<button onclick="selectFormula(${j})">${j+1}. ${esc(option)}</button>`).join('')}</div><p id="mathStatus" class="progress-note" aria-live="polite">先選算法，再按計算機。</p>`;
  else html+=`<p class="step">第二步：用計算機算出結果。</p><p class="question">${esc(m.options[m.correct])} = ______ 元</p><div class="field"><label>總共要付多少元？</label><input id="numberResponse" inputmode="numeric" type="number" placeholder="輸入計算結果"></div><div class="toolbar"><button class="primary" onclick="checkNumber()">核對答案</button><button onclick="resetFormula()">重選算式</button></div>`;
  html+=`<div class="toolbar"><button onclick="skipQuestion()">先跳過</button></div></section>`;return html;
 }
 html+=s==='E'?`<div class="math-word-problem">${esc(q.stem)}<div>${voice(q.stem,'🔊 聽生活狀況')}</div></div>`:`<div class="question">${esc(q.stem)} ${voice(q.stem,'🔊 聽問題')}</div>`;
 if(s==='C'&&conversationMode==='speech'){
  html+=`<p class="progress-note">看著三個選項，請說出適當的<strong>完整句子</strong>。</p>${q.options.map((v,j)=>`<div class="answer-preview">${j+1}. ${esc(v)} ${voice(v,'🔊 聽選項')}</div>`).join('')}`;
  html+=`<div class="toolbar"><button class="primary" onclick="startListening()">🎤 開始語音回答</button><button onclick="setConversationMode('tap')">改回點選</button><button onclick="skipQuestion()">先跳過</button></div><div id="speechFeedback">${speechStatus?`<div class="speech-status">${esc(speechStatus)}${speechTranscript?`<div>辨識文字：${esc(speechTranscript)}</div>`:''}</div>`:''}</div><p class="progress-note">麥克風須由使用者授權；部分瀏覽器需要連線才能辨識。辨識結果不是發音品質評分。</p>`;
 }else{
  html+=`<div class="answers">${q.options.map((v,j)=>`<div style="display:flex;gap:6px"><button style="flex:1" onclick="pick(${j})">${j+1}. ${esc(v)}</button>${voice(v,'🔊')}</div>`).join('')}</div><div class="toolbar"><button onclick="skipQuestion()">先跳過</button></div>`;
 }
 html+='</section>';return html;
}
function resetFormula(){mathReady=false;render()}
function mark(ok){
 const k=progressKey(),p=state.progress[k]||{tried:{},correct:0,done:false};const id=one().id;
 if(!(id in p.tried)){p.tried[id]=ok;if(ok)p.correct++}
 p.last=Date.now();state.progress[k]=p;save();return p;
}
function nextQuestion(){
 stopVoice();if(speechEngine){try{speechEngine.abort()}catch(e){}speechEngine=null}
 view.index++;mathReady=false;mathStage='method';mathFirstMethodCorrect=true;mathFirstNumberCorrect=true;mathInput='';speechStatus='';speechTranscript='';
 if(view.index>=qs().length){
  const p=state.progress[progressKey()]||{tried:{},correct:0};p.done=true;
  p.star=p.correct/qs().length>=.9?3:p.correct/qs().length>=.6?2:1;
  state.progress[progressKey()]=p;save();view.mode='finished';render();
 }else render();
}
function skipQuestion(){mark(false);nextQuestion()}
function pick(j){
 const q=one(),ok=j===q.answer;mark(ok);
 if(ok){
  const finished=view.section==='A'?q.stem.replace('（　）',q.answerText):q.answerText;
  app.innerHTML=`<section class="card"><div class="step">☑ 正確答案 ${voice(finished)}</div><h2>答對了</h2><p class="question">${esc(finished)}</p><button class="primary" onclick="nextQuestion()">下一題</button></section>`;
 }else{
  const warning=document.getElementById('answerRetry');if(warning)warning.remove();
  app.insertAdjacentHTML('beforeend','<section id="answerRetry" class="card warning">再看看題目或通知，可以選另一個答案。<button onclick="render()">重新看題目</button></section>');
 }
}
function checkNumber(){
 const element=document.getElementById('numberResponse'),v=element?.value||'',ok=v!==''&&Number(v)===one().answer;
 mark(ok);
 if(ok)app.innerHTML=`<section class="card"><h2>答對了</h2><p>答案：${one().answer} 元</p><p>已先判斷算式，再使用計算機。</p><button class="primary" onclick="nextQuestion()">下一題</button></section>`;
 else alert('再核對一次。請確認選用的算式與計算機上的數字。');
}
function checkType(){
 const v=document.getElementById('typeResponse').value.trim();state.typing=state.typing||{};state.typing[one().id]=v;save();
 const ok=v.replace(/\s/g,'')===one().target.replace(/\s/g,'');mark(ok);
 if(ok)app.innerHTML='<section class="card"><h2>文字輸入完成</h2><button class="primary" onclick="nextQuestion()">下一項</button></section>';
 else alert('與題目的文字不同。可以再確認，或選「下一項」。');
}
function finished(){
 const p=state.progress[progressKey()]||{correct:0,star:1},idx=sectionList.indexOf(view.section);
 return `<section class="card"><h2>${view.section} 區完成</h2><p class="stars">${'★'.repeat(p.star||1)}${'☆'.repeat(3-(p.star||1))}</p><p>第一次答對 ${p.correct} / ${qs().length} 題。語音辨識不是口說清晰程度的正式評量。</p><div class="toolbar"><button class="primary" onclick="${idx<5?`start(${view.week},${view.day},'${sectionList[idx+1]}')`:`openDay(${view.week},${view.day})`}">${idx<5?'前往下一區':'返回區塊選單'}</button><button onclick="openDay(${view.week},${view.day})">查看 A～F 區塊</button></div></section>`;
}
function render(){
 app.innerHTML=view.mode==='home'?showHome():view.mode==='day'?showDay():view.mode==='practice'?renderPractice():finished();
}
// 測試路徑顯示所有課程；正式首頁仍依 GitHub 設定限制開放。
const remoteRefresh=refreshCourseSettings;
refreshCourseSettings=async function(){
 if(location.protocol==='file:'||location.protocol==='about:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.pathname.includes('/teacher-preview/')){courseSettings={...PREVIEW_COURSE};courseStatus='preview';if(view.mode==='practice'&&!canOpen(view.week,view.day))view.mode='home';render();return}
 return remoteRefresh();
};
app.innerHTML='<section class="card"><h1>生活自立學習站</h1><p>正在讀取教師開放設定……</p></section>';
refreshCourseSettings();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCourseSettings()});
window.addEventListener('focus',()=>refreshCourseSettings());
</script></body></html>
