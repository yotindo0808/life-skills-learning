<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學小站｜紙本版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/bpmf-iansui@5.3.1/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/iansui@5.3.1/index.css" rel="stylesheet">
<style>
/* 數學小站｜紙本版：沒帶 iPad 時使用。步驟和網頁版相同 */
@page{size:A4;margin:12mm 13mm}
*{box-sizing:border-box}
body{margin:0;color:#1f2430;font:16pt/1.45 "Bpmf Iansui","Noto Sans TC","Noto Sans CJK TC","PingFang TC",sans-serif;background:#eef1f5}
body.nozy{font-family:"Iansui","Noto Sans TC","Noto Sans CJK TC","PingFang TC",sans-serif}
.ui{font-family:"Noto Sans TC","PingFang TC",sans-serif;font-size:16px;background:#fff;padding:14px 18px;border-bottom:1px solid #d5dbe3;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
.ui select,.ui button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid #c9d0da;background:#fff}
.ui .pri{background:#e8772e;color:#fff;border-color:#e8772e}
.ui label{display:flex;gap:6px;align-items:center}
.ui a{color:#3a6fb0}
.sheet{width:210mm;margin:16px auto;background:#fff;padding:12mm 13mm;box-shadow:0 2px 10px rgba(0,0,0,.08)}
@media print{.ui{display:none}body{background:#fff}.sheet{margin:0;padding:0;box-shadow:none;width:auto}.sheet+.sheet{break-before:page;page-break-before:always}}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1mm solid #1f2430;padding-bottom:2mm;margin-bottom:3mm}
.head h1{margin:0;font-size:20pt;font-weight:400}
.head .meta{font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;font-size:11pt;color:#555;text-align:right}
.rule{font-size:13pt;border:.5mm solid #999;border-radius:3mm;padding:1.5mm 3mm;margin-bottom:4mm}
.q{break-inside:avoid;page-break-inside:avoid;border:.6mm solid #1f2430;border-radius:4mm;padding:4mm 5mm;margin-bottom:5mm}
.qh{display:flex;gap:3mm;align-items:center;margin-bottom:2mm}
.qn{flex:none;width:10mm;height:10mm;border-radius:50%;background:#1f2430;color:#fff;display:grid;place-items:center;font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;font-size:14pt}
.qt{font-size:17pt}
.step{display:flex;gap:3mm;align-items:center;flex-wrap:wrap;margin:2.5mm 0}
.sn{flex:none;font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;font-size:12pt;background:#eef1f5;border-radius:2mm;padding:.5mm 2.5mm}
.ch{border:.5mm solid #888;border-radius:3mm;padding:1.5mm 4mm;font-size:16pt}
.bx{width:22mm;height:22mm;border:.7mm solid #1f2430;border-radius:1.5mm;display:inline-block;vertical-align:middle}
.bx.s{width:16mm;height:16mm}
.bx.w{width:34mm}
.pv{display:flex;gap:3mm;align-items:flex-end}
.pv span{display:flex;flex-direction:column;align-items:center;font-size:13pt;color:#555}
.big{font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;font-size:60pt;line-height:1;border:.6mm solid #1f2430;border-radius:4mm;padding:2mm 8mm;display:inline-block}
.goods{display:flex;gap:4mm;flex-wrap:wrap}
.good{border:.5mm solid #999;border-radius:3mm;padding:1mm 4mm;display:flex;gap:2mm;align-items:center;font-size:15pt}
.good .e{font-size:22pt}
.good .p{font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;background:#fff4c2;border:.4mm solid #c9a93a;border-radius:2mm;padding:0 2mm}
.draw{border:.5mm dashed #9aa;border-radius:3mm;height:42mm;width:100%;position:relative;margin:1mm 0 2mm}
.draw i{position:absolute;left:3mm;top:1mm;font-style:normal;font-size:10pt;color:#999}
.field{position:relative;height:62mm;border:.5mm solid #999;border-radius:3mm}
.field b{position:absolute;font-size:17pt;font-weight:400;transform:translate(-50%,-50%)}
.coins{display:flex;flex-wrap:wrap;gap:2.5mm;align-items:center}
.coin{width:15mm;height:15mm;border-radius:50%;border:.6mm solid #777;display:grid;place-items:center;font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;font-size:12pt;background:#eee}
.coin.c50{width:17mm;height:17mm;background:#f2e2a8}.coin.c1{width:11mm;height:11mm;font-size:10pt;background:#f1d3c4}
.bill{width:28mm;height:13mm;border:.6mm solid #9e4a42;border-radius:1.5mm;background:#f3cfca;display:grid;place-items:center;font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;font-size:12pt}
.chain{display:flex;flex-wrap:wrap;gap:2mm}
.fix{font-size:11pt;color:#777;display:flex;gap:2mm;align-items:center}
.fix .bx{width:14mm;height:14mm;border-style:dashed;border-color:#999}
.chk{font-size:13pt;display:flex;gap:8mm;margin-top:2mm;border-top:.3mm solid #bbb;padding-top:2mm}
.cb{display:inline-block;width:6mm;height:6mm;border:.5mm solid #1f2430;border-radius:1mm;vertical-align:-1mm;margin-right:1.5mm}
.key{break-before:page;page-break-before:always;font-family:"Noto Sans TC","Noto Sans CJK TC",sans-serif;font-size:12pt}
.key table{border-collapse:collapse;width:100%}
.key td,.key th{border:.3mm solid #999;padding:1.5mm 2mm;text-align:left;vertical-align:top}
.key th{background:#eef1f5}
</style>
</head>
<body>
<div class="ui">
  <b>數學小站｜紙本版</b>
  <label>A 數感 <select id="sA"></select></label>
  <label>B 運算判斷 <select id="sB"></select></label>
  <label>C 量 <select id="sC"><option value="len">長度</option><option value="cap">容量</option><option value="wt">重量</option></select></label>
  <label>份數 <select id="sN"><option>1</option><option selected>2</option><option>3</option></select></label>
  <label><input type="checkbox" id="zy" checked> 注音</label>
  <button id="re">換一組題目</button>
  <button class="pri" id="pr">列印</button>
  <a href="./">回數學小站</a>
</div>
<div id="out"></div>
<script src="questions.js?v=3"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let NAME='大吉';try{NAME=localStorage.getItem('daji-name')||'大吉'}catch(e){}
const nm=s=>String(s).split('NAME').join(NAME);
let CFG={A:0,B:2,C:['len']};try{const c=JSON.parse(localStorage.getItem('daji-math-cfg')||'null');if(c&&c.B)CFG={A:c.v?c.A:0,B:c.B,C:c.C||['len']}}catch(e){}
$('sA').innerHTML=Object.entries(A_LV).map(([k,v])=>`<option value="${k}" ${CFG.A==k?'selected':''}>${v}</option>`).join('');
$('sB').innerHTML=Object.entries(B_LV).map(([k,v])=>`<option value="${k}" ${CFG.B==k?'selected':''}>${v}</option>`).join('');
$('sC').value=CFG.C[0]||'len';
try{$('zy').checked=localStorage.getItem('daji-zhuyin')!=='off'}catch(e){}
const CIR='○';
const opt=a=>shuf(a).map(o=>`<span class="ch">${CIR} ${esc(o)}</span>`).join('');
const pv=()=>`<div class="pv">${['百','十','個'].map(l=>`<span><i class="bx"></i>${l}</span>`).join('')}</div>`;
const fix=n=>`<div class="fix">改正格 ${'<i class="bx"></i>'.repeat(n)}</div>`;
const goodsH=q=>`<div class="goods">${q.goods.map(g=>`<span class="good"><span class="e">${g[2]}</span>${esc(g[0])}<span class="p">${g[1]} 元</span></span>`).join('')}</div>`;
function body(q){
 if(q.type==='read')return `<div class="qt">這個數字怎麼唸？圈出來。</div><div class="step"><span class="big">${q.n}</span></div><div class="step">${opt(q.opts)}</div>`;
 if(q.type==='write')return `<div class="qt">聽老師唸數字，寫進百、十、個的格子裡。</div><div class="step">${pv()}${fix(3)}</div>`;
 if(q.type==='cash')return `<div class="qt">錢包裡有這些錢。總共多少元？寫進百、十、個的格子裡。</div>
  <div class="step coins">${'<span class="bill">100 元</span>'.repeat(q.h)}</div><div class="step coins">${'<span class="coin">10</span>'.repeat(q.t)}${'<span class="coin c1">1</span>'.repeat(q.o)}</div><div class="step">${pv()}<span>元</span>${fix(3)}</div>`;
 if(q.type==='count')return `<div class="qt">${esc(q.text)}</div><div class="step" style="font-size:12pt;color:#555">數過的打一個勾。十個一組圈起來，比較不會數錯。</div>
  <div class="field">${q.pts.map(p=>`<b style="left:${p[0]}%;top:${p[1]}%">${q.emoji}</b>`).join('')}</div><div class="step">總共 <i class="bx"></i><i class="bx"></i> ${esc(q.unit)}</div>`;
 if(q.type==='skip')return `<div class="qt">${esc(q.text)}</div><div class="step coins">${Array.from({length:q.n},()=>q.pair?'<span style="font-size:20pt">👟👟</span>':`<span class="coin">${q.coin}</span>`).join('')}</div>
  <div class="step">一個一個往上數：</div><div class="chain">${'<i class="bx s"></i>'.repeat(q.n)}</div>`;
 if(q.type==='mixed')return `<div class="qt">${esc(q.text)}</div><div class="step coins">${q.coins.map(c=>`<span class="coin c${c}">${c}</span>`).join('')}</div>
  <div class="step">從大的錢開始，一個一個加上去：</div><div class="chain">${'<i class="bx s"></i>'.repeat(q.coins.length)}</div>`;
 if(q.type==='unit')return `<div class="qt">${esc(q.text)}</div><div class="step"><span style="font-size:30pt">${q.emoji}</span><span>${esc(q.name)}</span></div><div class="step">這一題不用算。圈一個：${opt(q.opts)}</div>`;
 if(q.type==='op')return goodsH(q)+`<div class="qt" style="margin-top:2mm">${esc(nm(q.text))}</div><div class="step"><span class="sn">要算嗎？</span>這一題不用算，比一比就好。</div><div class="step"><span class="sn">圈一個</span>${opt(q.ansOpts)}</div>
  <div class="step"><span class="sn">為什麼</span><i class="bx w"></i> 比 <i class="bx w"></i> ${q.ansOpts[0]==='夠'?'多（少）':'貴'}</div>`;
 /* 購物題：老師的步驟 */
 return goodsH(q)+(q.money?`<div class="step">💰 ${q.money} 元</div>`:'')+`<div class="qt" style="margin-top:2mm">${esc(nm(q.text))}</div>
  <div class="step"><span class="sn">1 要買幾個東西？</span><i class="bx s"></i> 個</div><div class="draw"><i>有幾個東西，就畫幾個圈圈；每個圈圈寫上價錢</i></div>
  <div class="step"><span class="sn">2 題目問</span>${opt(['一共要付多少錢','還剩（找回）多少錢'])}</div>
  <div class="step"><span class="sn">3 價錢都一樣嗎？</span>${opt(['一樣','不一樣'])}</div>
  <div class="step"><span class="sn">4 要用</span>${opt(['加','減','乘'])}</div>
  <div class="step"><span class="sn">5 列式</span><i class="bx w"></i><i class="bx s"></i><i class="bx w"></i> ＝ <i class="bx w"></i> 元</div>
  <div class="step"><span class="sn">6 檢查</span>${esc(q.check.q)} ${opt(q.check.opts)}</div>`}
function build(){
 const cfg={A:+$('sA').value,B:+$('sB').value,C:[$('sC').value]};const n=+$('sN').value;
 document.body.classList.toggle('nozy',!$('zy').checked);
 const d=new Date();let html='';const keys=[];
 for(let k=0;k<n;k++){R=Math.random;
  const qs=[makeQ('A',0,cfg),makeQ('C',k,cfg),makeQ('B',0,cfg),makeQ('B',1,cfg)];
  html+=`<div class="sheet"><div class="head"><h1>數學小站｜第 ${k+1} 份</h1><div class="meta">日期：＿＿月＿＿日<br>練習用</div></div>
   <div class="rule">先看清楚，再想一想，最後才算。列好算式，才可以用計算機。</div>
   ${qs.map((q,i)=>`<div class="q"><div class="qh"><span class="qn">${i+1}</span></div>${body(q)}<div class="chk"><span><span class="cb"></span>我檢查過了</span><span><span class="cb"></span>我有問題，要問老師</span></div></div>`).join('')}</div>`;
  keys.push(...qs.map((q,i)=>[k+1,i+1,qLabel(q),nm(qAnswer(q))]))}
 html+=`<div class="sheet key"><div class="head"><h1>答案（老師用）</h1><div class="meta">列印日期：${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}</div></div>
  <table><tr><th>份</th><th>題</th><th>層級</th><th>答案</th></tr>${keys.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</table>
  <p>「聽老師唸數字」的題目，請照上表唸給學生聽。購物題的第 1 步，請看學生有沒有畫對圈圈數、寫對價錢。</p></div>`;
 $('out').innerHTML=html}
['sA','sB','sC','sN','zy'].forEach(id=>$(id).onchange=build);
$('re').onclick=build;$('pr').onclick=()=>window.print();
build();
</script>
</body>
</html>
