<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>數學小站｜生活自立學習站</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/bpmf-iansui@5.3.1/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/iansui@5.3.1/index.css" rel="stylesheet">
<style>
/* 大吉學習站｜數學小站：每次 3 題，先判斷再按計算機。版面與上課頁一致 */
:root{color-scheme:light;--bg:#fbfaf7;--ink:#1f2430;--muted:#5b6170;--left:#e3eef7;--line:#d5dbe3;--accent:#e8772e;--accent-d:#c45f1d;--ok:#2f7d5b;--help:#3a6fb0;--warn:#fff4e5;--bad:#b3261e}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.5 "Bpmf Iansui","Noto Sans TC","PingFang TC",sans-serif;}
body.nozy{font-family:"Iansui","Noto Sans TC","PingFang TC",sans-serif}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
button{touch-action:manipulation;-webkit-touch-callout:none;font:inherit;color:inherit;border:0;cursor:pointer;border-radius:16px;min-height:56px;padding:10px 22px}
button:focus-visible{outline:4px solid var(--help);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.app{display:grid;grid-template-rows:64px 1fr 96px;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
.tag{font-size:16px;background:var(--warn);color:#8a4b10;padding:4px 12px;border-radius:999px}
.title{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home{font-family:"Noto Sans TC","PingFang TC",sans-serif;font-size:17px;color:var(--help);text-decoration:none;background:#e7effa;padding:8px 14px;border-radius:12px}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}.dots i.pd{background:#9fb8cf}
.zy{font-family:"Noto Sans TC","PingFang TC",sans-serif;min-height:44px;font-size:17px;background:#fff;border:2px solid var(--line);color:var(--ink);padding:4px 14px}
.zy b{color:var(--accent)}
.tbtn{font-family:"Noto Sans TC","PingFang TC",sans-serif;min-height:44px;font-size:17px;background:#eef1f5;color:var(--muted);padding:6px 16px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.left{background:var(--left);padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;overflow:auto;text-align:center}
.right{padding:20px 26px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.q{font-size:28px;line-height:1.45;-webkit-text-stroke:.3px var(--ink)}
.sub{color:var(--muted);font-size:20px}
.bottom{display:flex;gap:12px;align-items:center;padding:0 20px;border-top:1px solid var(--line);background:#fff}
.big{font-size:22px;min-height:68px;padding:0 22px}
.done{background:var(--accent);color:#fff;font-size:24px;padding:0 30px}
.done.off{background:#e9d3c3;color:#fff}
.helpb{background:#e7effa;color:var(--help)}
.again,.back{background:#eef1f5}
.spacer{flex:1}
.msg{font-size:21px;border-radius:14px;padding:10px 16px;background:#fff3ea;color:#8a4b10}
.msg.good{background:#e6f4ec;color:var(--ok)}
.banner{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--help);color:#fff;padding:12px 26px;border-radius:999px;font-size:21px;display:none;z-index:20;max-width:90vw;text-align:center}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px;width:100%;max-width:440px;text-align:left}
.list li{background:#fff;border-radius:16px;padding:12px 18px;display:flex;gap:14px;align-items:center;font-size:24px}
.list li b{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-size:20px;font-weight:400}

/* 步驟條：看 → 判斷 → 列式 → 算 → 檢查 */
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.steps span{font-size:18px;padding:4px 14px;border-radius:999px;background:#eef1f5;color:var(--muted)}
.steps span.on{background:var(--ink);color:#fff}
.steps span.pd{background:#e6f4ec;color:var(--ok)}
.steps em{font-style:normal;color:var(--line)}
.calcbtn{margin-left:auto;font-size:18px;min-height:46px;padding:4px 14px;background:#eef1f5}
.calcbtn.open{background:var(--ink);color:#fff}

/* 情境卡 */
.card{background:#fff;border-radius:18px;padding:16px 20px;border:2px solid var(--line);text-align:left;max-width:480px;width:100%}
.story{font-size:26px;line-height:1.7}
.num{display:inline-block;min-width:1.6em;min-height:0;text-align:center;border-bottom:3px dashed #9fb8cf;padding:0 6px;margin:0 2px;border-radius:6px;background:#f3f8fc;font-size:inherit;line-height:1.4}
.num.hit{background:#ffe2cc;border-bottom-color:var(--accent)}
.goods{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.good{background:#fff;border-radius:16px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;min-width:110px}
.good .e{font-size:48px;line-height:1.1}
.good .p{font-size:24px;background:#fff4c2;border:2px solid #e2c35a;border-radius:10px;padding:0 10px;margin-top:4px}

/* 數東西 */
.field{position:relative;width:100%;max-width:520px;aspect-ratio:4/3;background:#fff;border-radius:18px}
.obj{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;font-size:34px;line-height:52px;text-align:center;border-radius:50%;padding:0;min-height:0;background:transparent}
.obj.g0{box-shadow:0 0 0 4px #3a6fb0}.obj.g1{box-shadow:0 0 0 4px #e8772e}.obj.g2{box-shadow:0 0 0 4px #2f7d5b}.obj.g3{box-shadow:0 0 0 4px #9b3b63}.obj.g4{box-shadow:0 0 0 4px #7a6a1d}
.coins{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px}
.coin{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:4px solid #8f8f8f;background:#dcdcdc;color:#333;padding:0;min-height:0}
.coin.c50{width:88px;height:88px;background:#e8c766;border-color:#a8862a;color:#5a4410}
.coin.c5{width:70px;height:70px}
.coin.c1{width:58px;height:58px;font-size:22px;background:#e9b49a;border-color:#a0644a;color:#4d2a1a}
.coin.now{box-shadow:0 0 0 5px var(--accent)}
.coin.used{opacity:.45}
.coin .ord{position:absolute;margin:-60px 0 0 60px;font-size:18px;background:var(--ink);color:#fff;border-radius:999px;padding:0 8px}
.pairs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px}
.pair{background:#fff;border-radius:14px;padding:6px 10px;font-size:36px;border:3px solid transparent}
.pair.now{border-color:var(--accent)}

/* 接龍格與數字鍵 */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.box{min-width:78px;height:64px;border-radius:12px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font-size:28px;padding:0 8px}
.box.cur{border-color:var(--accent)}
.box.ok{border-color:var(--ok);background:#e6f4ec}
.box.no{border-color:var(--bad);background:#fdecea}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:520px}
.pad button{background:#fff;border:2px solid var(--line);font-size:26px;min-height:58px;padding:0}
.pad .ok{background:var(--ink);color:#fff;border-color:var(--ink);grid-column:span 2;font-size:22px}

/* 列式 */
.expr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slot{min-width:92px;height:72px;border-radius:14px;border:3px dashed #9fb8cf;background:#fff;display:grid;place-items:center;font-size:32px;padding:0 10px}
.slot.f{border-style:solid;border-color:var(--ink)}
.slot.op{min-width:72px}
.eq{font-size:32px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{background:#fff;border:3px solid var(--line);font-size:30px;min-width:86px;min-height:66px}
.tile.op{background:#f3f6f9}

/* 選項 */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{background:#fff;border:2px solid var(--line);font-size:23px;min-height:64px}
.opt.sel{border-color:var(--accent);background:#fff3ea}

/* 單位 */
.thing{font-size:96px;line-height:1.1}
.thingname{font-size:30px;background:#fff;border-radius:14px;padding:4px 20px}
.bench{display:grid;gap:8px;width:100%;max-width:470px}
.bench div{background:#fff;border-radius:12px;padding:8px 14px;text-align:left;font-size:19px}

/* 計算機 */
.calc{background:#2b2f38;border-radius:18px;padding:12px;width:100%;max-width:340px;display:grid;gap:8px}
.calc .dsp{background:#d9e4d0;border-radius:10px;font-size:34px;text-align:right;padding:6px 12px;min-height:56px;font-family:"Noto Sans TC",sans-serif;overflow:hidden}
.calc .keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.calc .keys button{background:#4a505c;color:#fff;font-size:26px;min-height:54px;padding:0;font-family:"Noto Sans TC",sans-serif}
.calc .keys .o{background:#e8772e}

/* 語音輸入（與上課頁相同） */
.mic{background:var(--help);color:#fff;font-size:24px;min-height:74px;display:flex;align-items:center;gap:12px;align-self:flex-start;padding:0 30px}
.mic.on{background:#d64545}
.mic svg{width:28px;height:28px}
.heard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 18px;font-size:26px;min-height:60px}
.heard small{display:block;font-size:17px;color:var(--muted)}
.kbd{display:flex;gap:10px}.kbd input{flex:1;font:inherit;font-size:22px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;-webkit-user-select:text;user-select:text}

/* 教師面板（與上課頁相同） */
.panel{font-family:"Noto Sans TC","PingFang TC",sans-serif;position:fixed;inset:0 0 0 auto;width:min(480px,94vw);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .2s;z-index:30;display:flex;flex-direction:column;font-size:17px}
.panel.open{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700}
.pb{padding:12px 16px;overflow:auto;display:grid;gap:14px;align-content:start;-webkit-user-select:text;user-select:text}
.pb h4{margin:0 0 6px;font-size:16px;color:var(--muted)}
.pb button{min-height:44px;font-size:16px;background:#eef1f5;padding:6px 12px;border-radius:12px}
.pb .pri{background:var(--accent);color:#fff}
.pb button.on{background:var(--ink);color:#fff}
.pb select,.pb input[type=text],.pb textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.pb textarea{min-height:64px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans{background:#f3f6f9;border-radius:10px;padding:8px 10px;font-size:16px;line-height:1.55}
.log{font-size:14px;color:var(--muted);max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:40}
.modal .box2{font-family:"Noto Sans TC","PingFang TC",sans-serif;background:#fff;border-radius:18px;padding:22px;max-width:420px;font-size:19px;display:grid;gap:14px}
@media(max-width:820px){.main{grid-template-columns:minmax(0,1fr)}.big{font-size:19px;padding:0 14px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home" href="../">回首頁</a>
    <span class="tag">練習用</span>
    <div class="title" id="title"></div>
    <div class="dots" id="dots"></div>
    <button class="zy" id="zyBtn"></button>
    <button class="tbtn" id="tbtn">老師</button>
  </header>
  <main class="main">
    <section class="left" id="left"></section>
    <section class="right" id="right"></section>
  </main>
  <footer class="bottom">
    <button class="big back" id="bBack">上一題</button>
    <button class="big again" id="bAgain">再聽一次題目</button>
    <button class="big helpb" id="bHelp">我需要幫忙</button>
    <span class="spacer"></span>
    <button class="big done" id="bDone">我做好了</button>
  </footer>
</div>
<div class="banner" id="banner"></div>

<aside class="panel" id="panel" aria-label="教師面板">
  <div class="ph"><span>教師面板｜數學小站</span><div class="row"><button class="tbtn" id="pLock">上鎖並關閉</button><button class="tbtn" id="pClose">關閉</button></div></div>
  <div class="pb">
    <div><h4>這一題</h4><div id="pCtx"></div></div>
    <div><h4>這一題的提示程度</h4><div class="row" id="pLevel"></div></div>
    <div><h4>備註（只存在匯出檔，重新整理會消失）</h4><textarea id="pNote"></textarea></div>
    <div><h4>出題層級（存在這台 iPad）</h4>
      <div class="ans" style="margin-bottom:6px">A 數感</div><div class="row" id="pA"></div>
      <div class="ans" style="margin:6px 0">B 運算判斷</div><div class="row" id="pB"></div>
      <div class="ans" style="margin:6px 0">C 量（可複選，每次輪流出一題）</div><div class="row" id="pC"></div>
      <div class="row" style="margin-top:8px"><button id="pRe">換一組新題目</button><button id="pReOne">只換這一題</button></div>
    </div>
    <div><h4>本次紀錄</h4><div class="log" id="pLog"></div></div>
    <div><h4>角色名稱</h4><div class="row"><input type="text" id="pName" style="flex:1"><button id="pNameSave">儲存</button></div></div>
    <div class="row"><button class="pri" id="pExport">匯出紀錄</button><button id="pClear">清除數學小站的紀錄</button></div>
    <div class="ans">數學小站的紀錄和上課頁分開存放；清除這裡不會影響上課頁的紀錄。</div>
  </div>
</aside>
<div class="modal" id="pin"><div class="box2" style="text-align:center"><div id="pinMsg"></div><div id="pinDots" style="font-size:34px;letter-spacing:12px;min-height:44px"></div><div id="pinPad" style="display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center"></div><div class="row" style="justify-content:center"><button id="pinCancel" style="background:#eef1f5;min-height:48px">取消</button></div></div></div>
<div class="modal" id="modal"><div class="box2"><div id="mText"></div><div class="row"><button id="mNo" style="background:#eef1f5;min-height:48px">取消</button><button id="mYes" style="background:#b3261e;color:#fff;min-height:48px">確定</button></div></div></div>

<script>
/* ================= 共用小工具 ================= */
const LESSON='math';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`};
const lsGet=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let NAME=lsGet('daji-name','大吉');
const nm=s=>String(s).split('NAME').join(NAME);
const clean=t=>String(t).replace(/[\s，。、！？,.!?「」：:]/g,'');

/* 亂數：同一天打開，題目一樣（重新整理不會換題） */
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* 中文數字 → 阿拉伯數字（語音辨識可能給「四十五」） */
function cnNum(s){const d={零:0,〇:0,一:1,二:2,兩:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
 return String(s).replace(/[零〇一二兩两三四五六七八九十百]+/g,m=>{let total=0,cur=0;for(const ch of m){if(ch in d)cur=d[ch];else if(ch==='十'){total+=(cur||1)*10;cur=0}else if(ch==='百'){total+=(cur||1)*100;cur=0}}return String(total+cur)})}
const numsIn=t=>(cnNum(t).match(/\d+/g)||[]).map(Number);

/* ================= 設定（層級） ================= */
const A_LV={1:'A1 大數量點數',2:'A2 十個一數',3:'A3 五個一數',4:'A4 兩個一數',5:'A5 混合數錢'};
const B_LV={1:'B1 不用算／比大小',2:'B2 加：合起來',3:'B3 減：剩下、找回',4:'B4 加減混合'};
const C_TOP={len:'長度',cap:'容量',wt:'重量'};
let CFG={A:1,B:1,C:['len']};
try{const c=JSON.parse(lsGet('daji-math-cfg','null'));if(c&&c.A&&c.B&&Array.isArray(c.C))CFG=c}catch(e){}
const saveCfg=()=>lsSet('daji-math-cfg',JSON.stringify(CFG));

/* ================= 出題 ================= */
const COUNT_ITEMS=[['🍎','蘋果','顆'],['✏️','鉛筆','枝'],['🥚','雞蛋','顆'],['⭐','星星','個'],['🍬','糖果','顆']];
const GOODS=[['吐司',45,'🍞'],['牛奶',30,'🥛'],['飯糰',35,'🍙'],['麵包',28,'🥐'],['綠茶',25,'🍵'],['香蕉',20,'🍌'],['餅乾',18,'🍪'],['優格',32,'🥣'],['布丁',22,'🍮'],['豆漿',26,'🥤']];
const UNITS={
 len:{opts:['毫米','公分','公尺'],items:[['✏️','一枝鉛筆','有多長','公分'],['🥢','一雙筷子','有多長','公分'],['🧽','一塊橡皮擦','有多長','公分'],['🐜','一隻螞蟻','有多長','毫米'],['🍚','一粒米','有多長','毫米'],['🪙','一枚硬幣','有多厚','毫米'],['🏃','操場的跑道','有多長','公尺'],['🏊','游泳池','有多長','公尺'],['🚌','一輛公車','有多長','公尺']],
  bench:['1 毫米：差不多一張卡片那麼厚','1 公分：差不多指甲那麼寬','1 公尺：差不多張開手臂那麼長'],
  keys:[['毫米','毫米'],['公分','公分'],['公分','釐米'],['公分','厘米'],['公尺','公尺']]},
 cap:{opts:['毫升','公升'],items:[['🥛','一杯水','有多少','毫升'],['🧃','一小罐養樂多','有多少','毫升'],['🥄','一湯匙醬油','有多少','毫升'],['🪣','一大桶水','有多少','公升'],['🛁','一缸洗澡水','有多少','公升']],
  bench:['1 毫升：差不多一滴一滴的一小點點','1 公升：差不多一大瓶礦泉水再多一點'],
  keys:[['毫升','毫升'],['公升','公升']]},
 wt:{opts:['公克','公斤'],items:[['🥚','一顆雞蛋','有多重','公克'],['🍪','一片餅乾','有多重','公克'],['✏️','一枝鉛筆','有多重','公克'],['🍚','一袋米','有多重','公斤'],['🍉','一顆西瓜','有多重','公斤'],['🧍','一個人的體重','是多少','公斤']],
  bench:['1 公克：差不多一個迴紋針那麼輕','1 公斤：差不多一大瓶礦泉水再重一點'],

 const r=R();const [a,pa,ea]=two[0];

function makeQ(strand,idx){

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let srObj=null,srOn=false,srLive='',srFail=!SR;

 try{speechSynthesis.cancel()}catch(e){}srLive='';const r=new SR();srObj=r;r.lang='zh-TW';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
 r.onresult=e=>{let t='';for(const res of e.results)t+=res[0].transcript;srLive=t;const h=$('heardTxt');if(h)h.textContent=t};
 r.onerror=e=>{log('語音輸入錯誤',{原因:e.error});if(e.error!=='no-speech'&&e.error!=='aborted'){srFail=true;note('語音輸入沒有反應，改用鍵盤上的麥克風說。')}else if(e.error==='no-speech')note('沒有聽到聲音，再按一次，大聲一點說。')};
 r.onend=()=>{srOn=false;const t=srLive.trim();if(t)addTry(t,'語音');else render()};

function addTry(t,via){const x=X();x.tries.push({text:t,via,ph:phKey(),ts:now()});log('說',{文字:t,方式:via,步驟:phKey()});render()}

 if(srFail)h+=`<div class="sub">請點下面的格子，按鍵盤上的麥克風說，說完按「送出」。</div><div class="kbd"><input id="kbdIn" type="text" autocomplete="off"><button class="opt" data-kbd="1" style="min-height:52px">送出</button></div>`;

 const tries=x.tries.length?x.tries.map((t,i)=>`${i+1}. ${esc(t.text)}（${t.via}｜${t.ph}）`).join('<br>'):'還沒有說';
 $('pCtx').innerHTML=`<div class="ans">${esc(qLabel(q))}｜${esc(nm(qText(q)))}</div><div class="ans" style="margin-top:6px">答案：${esc(qAnswer(q))}</div>
  <div class="ans" style="margin-top:6px">判斷：${esc(x.judgeRes||'—')}${x.picks&&x.picks.length?'（選過：'+esc(x.picks.join('、'))+'）':''}｜列式：${esc(x.exprRes||'—')}｜答案：${esc(x.result||'進行中')}${x.ansTries.length?'（輸入過：'+x.ansTries.join('、')+'）':''}｜合理檢查：${esc(x.checkRes||'—')}<br>用了計算機：${x.calcUsed?'是':'否'}｜<b>還沒列式就按計算機：${x.calcEarly} 次</b>${x.chainWrong?'｜接龍錯 '+x.chainWrong+' 次':''}</div>
  <h4 style="margin-top:8px">他說的（語音辨識）</h4><div class="ans">${tries}</div>
  <div class="row" style="margin-top:6px"><button data-pass="1">算他這一步對，放行</button></div>`;
 $('pLevel').innerHTML=LV.map(l=>`<button data-lv="${l}" class="${levels[s.key]===l?'on':''}">${l}</button>`).join('');
 $('pNote').value=notes[s.key]||'';renderLog()}
$('panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=S[cur];
 if(b.dataset.cfa){CFG.A=+b.dataset.cfa;saveCfg();log('老師設定',{A:CFG.A});return renderPanel()}
 if(b.dataset.cfb){CFG.B=+b.dataset.cfb;saveCfg();log('老師設定',{B:CFG.B});return renderPanel()}
 if(b.dataset.cfc){const k=b.dataset.cfc;CFG.C=CFG.C.includes(k)?CFG.C.filter(v=>v!==k):CFG.C.concat(k);if(!CFG.C.length)CFG.C=[k];saveCfg();log('老師設定',{C:CFG.C});return renderPanel()}
 if(b.dataset.lv&&s.q){levels[s.key]=b.dataset.lv;log('提示程度',{程度:b.dataset.lv});return renderPanel()}
 if(b.dataset.pass&&s.q){log('老師放行',{步驟:phKey()});$('panel').classList.remove('open');const x=s.x;x.msg='';const k=phKey();
  if(k==='judge'){x.judgeRes=(x.judgeRes||'')+'（老師判定）'}
  if(k==='expr'){const q=s.q;x.slots=[q.nums[0]+'',q.op==='+'?'＋':'－',q.nums[1]+''];x.exprRes='老師判定'}
  if(k==='count'&&s.q.type!=='count'){const q=s.q;const tot=q.type==='skip'?q.n:q.coins.length;if(q.type==='mixed'&&x.order.length<tot)x.order=q.coins.map((_,i)=>i).sort((a,b)=>q.coins[b]-q.coins[a]);x.chain=x.order.length?x.order.map((_,i)=>x.order.slice(0,i+1).reduce((a,j)=>a+q.coins[j],0)):Array.from({length:tot},(_,i)=>q.step*(i+1))}
  return goPh()}});
$('pNote').addEventListener('input',e=>{notes[S[cur].key]=e.target.value});
$('pRe').onclick=()=>{$('mText').textContent='依目前的層級換一組新題目？這次已經做的部分會留在紀錄裡。';$('modal').dataset.act='re';$('modal').style.display='grid'};
$('pReOne').onclick=()=>{const s=S[cur];if(!s.q)return;const old=s.q;const q=old.strand==='C'?genC(CFG.C[Math.floor(Math.random()*CFG.C.length)]||'len'):makeQ(old.strand,0);s.q=q;s.x=freshX(q);log('老師換題',{原本:qLabel(old),換成:qLabel(q)});render();renderPanel()};
async function renderLog(){const ev=(await allEv()).slice(-40).reverse();$('pLog').innerHTML=ev.map(x=>`<div>${esc(x.ts.slice(5,16))}｜${esc(x.題||'')}｜${esc(x.type)}${Object.keys(x.data).length?'：'+esc(JSON.stringify(x.data).replace(/[{}"]/g,'')):''}</div>`).join('')||'還沒有紀錄'}
$('pName').value=NAME;$('pNameSave').onclick=()=>{NAME=$('pName').value.trim()||'大吉';lsSet('daji-name',NAME);render()};
$('pExport').onclick=async()=>{const ev=await allEv();
 const sum=S.filter(s=>s.q).map(s=>{const q=s.q,x=s.x;return {題號:s.key,層級:qLabel(q),題目:nm(qText(q)),答案:qAnswer(q),判斷:x.judgeRes||'',判斷選過:x.picks||[],列式:x.exprRes||'',答案結果:x.result||'未完成',輸入過的答案:x.ansTries,合理檢查:x.checkRes||'',用了計算機:x.calcUsed,還沒列式就按計算機:x.calcEarly,接龍錯誤:x.chainWrong,他說的:x.tries.map(t=>`${t.ph}：${t.text}`),提示程度:levels[s.key]||'',備註:notes[s.key]||''}});
 const out={頁面:'數學小站',匯出時間:now(),出題層級:CFG,今天的題目摘要:sum,全部紀錄:ev};
 const d=new Date();const fn=`math_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();log('匯出紀錄',{檔名:fn})};
$('pClear').onclick=()=>{$('mText').textContent='確定要清除這台 iPad 上「數學小站」的所有紀錄嗎？請先確認已經匯出。';$('modal').dataset.act='clear';$('modal').style.display='grid'};
$('mNo').onclick=()=>$('modal').style.display='none';
$('mYes').onclick=async()=>{const act=$('modal').dataset.act;$('modal').style.display='none';if(act==='clear'){await clearAll();renderPanel()}else{log('換一組新題目',{});buildDay(true);render();renderPanel()}};

let ZY=lsGet('daji-zhuyin','on')!=='off';
function applyZy(){document.body.classList.toggle('nozy',!ZY);$('zyBtn').innerHTML=ZY?'注音：<b>開</b>':'注音：<b>關</b>';$('zyBtn').setAttribute('aria-label',ZY?'注音開著，按一下關掉':'注音關著，按一下打開')}
$('zyBtn').onclick=()=>{ZY=!ZY;lsSet('daji-zhuyin',ZY?'on':'off');log('切換注音',{注音:ZY?'開':'關'});applyZy()};
applyZy();
openDB().then(()=>log('打開數學小站',{層級:CFG}));buildDay(false);render();
</script>
</body>
