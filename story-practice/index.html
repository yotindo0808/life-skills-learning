function speak(t){if(!("speechSynthesis" in window)){alert("這個瀏覽器無法使用文字報讀。");return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang="zh-TW";u.rate=.87;u.pitch=1;window.speechSynthesis.speak(u)}catch(err){alert("目前無法報讀，請檢查裝置音量。")}}
function stopSpeak(){try{window.speechSynthesis.cancel()}catch(e){}}
function sayStory(n){speak(STORY[n].title+"。"+STORY[n].text)}
function sayAll(){speak(STORY.map(s=>s.title+"。"+s.text).join("。"))}
function answerFor(id){if(!state.answers[id]||typeof state.answers[id]!=="object")state.answers[id]={};return state.answers[id]}
function countDone(){return QUESTIONS.filter(q=>{const a=state.answers[q.id]||{};return a.choiceCorrect||a.typingSubmitted||a.speechSubmitted}).length}
function showReading(){stopSpeak();stopCapture();state.page="read";save();render()}
function showQuestions(){stopSpeak();stopCapture();state.page="questions";state.mode="choice";save();render()}
function showSummary(){stopSpeak();stopCapture();state.page="summary";save();render()}
function changeScene(delta){state.scene=Math.max(0,Math.min(STORY.length-1,state.scene+delta));if(state.scene===STORY.length-1)state.readCompleted=true;save();render()}
function nextScene(){if(state.scene===STORY.length-1){state.readCompleted=true;showQuestions()}else changeScene(1)}
function changeQ(delta){stopSpeak();stopCapture();state.question=Math.max(0,Math.min(QUESTIONS.length-1,state.question+delta));save();render()}
function setMode(m){if(!["choice","speech","typing"].includes(m))return;stopSpeak();stopCapture();state.mode=m;save();render()}
function reveal(){const q=QUESTIONS[state.question];state.revealed[q.id]=true;const a=answerFor(q.id);a.hints=(a.hints||0)+1;save();render()}
function render(){
 const pt=document.getElementById("progressTitle"),left=document.getElementById("leftPane"),right=document.getElementById("rightPane");
 pt.textContent=state.page==="read"?"短句第 "+(state.microIndex+1)+"／"+MICRO.length+" 題":state.page==="questions"?"進階第 "+(state.question+1)+"／6 題":"我的學習紀錄";
 document.getElementById("readTab").setAttribute("aria-current",state.page==="read"?"page":"false");
 document.getElementById("questionTab").setAttribute("aria-current",state.page==="questions"?"page":"false");
 document.getElementById("summaryTab").setAttribute("aria-current",state.page==="summary"?"page":"false");
 if(state.page==="read"){renderReading(left,right);return}
 if(state.page==="summary"){renderSummary(left,right);return}
 renderQuestions(left,right);
}
function microAnswer(id){
 if(!state.microAnswers||typeof state.microAnswers!=="object")state.microAnswers={};
 if(!state.microAnswers[id]||typeof state.microAnswers[id]!=="object")state.microAnswers[id]={};
 return state.microAnswers[id];
}
function countMicroDone(){return MICRO.filter(m=>!!microAnswer(m.id).correct).length}
function listenMicro(){
 const m=MICRO[state.microIndex],a=microAnswer(m.id);
 a.audioRequests=(a.audioRequests||0)+1;save();speak(m.clip);
 const label=document.getElementById("microAudioCount");
 if(label)label.textContent="報讀按鈕使用："+a.audioRequests+" 次";
}
function listenMicroQuestion(){speak(MICRO[state.microIndex].question)}
function microShowText(){const m=MICRO[state.microIndex];microAnswer(m.id).textViewed=true;state.microTextShown=true;save();render()}
function selectMicro(i){
 const m=MICRO[state.microIndex],a=microAnswer(m.id);
 if(!Number.isInteger(i)||i<0||i>1)return;
 a.attempts=(a.attempts||0)+1;
 if(a.firstCorrect===undefined)a.firstCorrect=i===m.answer;
 if(i===m.answer){a.correct=true;a.lastWrong=false}else a.lastWrong=true;
 save();render();
}
function microMove(delta){
 stopSpeak();stopCapture();
 state.microIndex=Math.max(0,Math.min(MICRO.length-1,state.microIndex+delta));
 state.microTextShown=false;save();render();
}
function renderReading(left,right){
 const m=MICRO[state.microIndex],a=microAnswer(m.id),done=countMicroDone();
 left.innerHTML='<div class="context-title">第 '+(state.microIndex+1)+'／'+MICRO.length+' 個短句｜'+e(m.title)+'</div>'+
 '<h2>先聽一小句</h2><p class="muted">可以重播。若聽不清楚，就看文字，不需要一直猜。</p>'+
 '<div class="toolbar"><button class="primary" onclick="listenMicro()">🔊 聽這一句</button>'+
 '<button onclick="listenMicro()">🔁 再聽一次</button>'+
 '<button onclick="microShowText()">📖 顯示這句文字</button><button onclick="stopSpeak()">停止報讀</button></div>'+
 '<p id="microAudioCount" class="small muted">報讀按鈕使用：'+(a.audioRequests||0)+' 次</p>'+
 (state.microTextShown?'<div class="prompt"><strong>這句話是：</strong><p>'+e(m.clip)+'</p></div>':
 '<div class="feedback">目前先不顯示句子。需要時按「顯示這句文字」幫助理解。</div>')+
 (state.microIndex===0?'<div class="feedback">這句只說舊公告，還沒講新通知；先回答舊公告的內容。</div>':'');
 right.innerHTML='<h2>'+e(m.question)+'</h2><div class="toolbar"><button onclick="listenMicroQuestion()">🔊 報讀問題</button></div>'+
 '<p class="small muted">選一個答案，不需要自己說完整件事。</p>'+
 m.choices.map((v,i)=>'<div class="option"><button class="choose" onclick="selectMicro('+i+')">'+
 (i+1)+'．'+e(v)+'</button><button class="readopt" aria-label="報讀選項 '+(i+1)+'" onclick="speak(MICRO['+
 state.microIndex+'].choices['+i+'])">🔊</button></div>').join("")+
 (a.correct?'<div class="feedback good">答對了。'+e(m.feedback)+'</div>':
 a.lastWrong?'<div class="feedback warn">這次選的答案不符合剛才的句子。可以再聽一次或顯示文字，再重選。</div>':'')+
 '<div class="footer"><button onclick="microMove(-1)" '+(state.microIndex===0?'disabled':'')+'>上一句</button>'+
 '<button class="primary" onclick="'+(state.microIndex===MICRO.length-1?'showSummary()':'microMove(1)')+'">'+
 (state.microIndex===MICRO.length-1?'查看練習紀錄':'下一句')+'</button></div>'+
 '<p class="small muted">已答對 '+done+'／'+MICRO.length+' 題。可以先跳過，未答對的題目不算完成。</p>';
}

function renderScaffoldInputs(q,a){
 const parts=Array.isArray(a.scaffoldParts)?a.scaffoldParts:[];
 return '<p class="small">一格只需要填入一項關鍵資訊。可以回看故事，不必一次寫出長篇文章。</p>'+
 '<div class="guided-answers">'+q.stems.map((step,i)=>
 '<div class="guided-step"><label for="scaffoldPart'+i+'">'+e(step.before)+' ______ '+e(step.after)+'</label>'+
 '<div class="small muted">'+e(step.hint)+'</div>'+
 '<input type="text" id="scaffoldPart'+i+'" autocomplete="off" spellcheck="false" placeholder="填入關鍵詞或短句" value="'+e(parts[i]||"")+'" oninput="scaffoldChange('+i+',this.value)"/>'+
 '</div>').join("")+'</div>';
}
function renderScaffoldSpeech(q){
 return '<div class="guided-answers"><strong>依提示逐句說，不必一次說整篇</strong>'+
 q.stems.map((step,i)=>'<div class="guided-step"><div>' +e(step.before)+' ______ '+e(step.after)+'</div>'+
 '<div class="small muted">'+e(step.hint)+'</div></div>').join("")+
 '</div><p class="small muted">可以一個步驟說完，再說下一個；口說練習不要求背下完整故事。</p>';
}
function renderQuestions(left,right){
 const q=QUESTIONS[state.question],a=answerFor(q.id),seen=!!state.revealed[q.id],related=(Array.isArray(q.scenes)?q.scenes:[q.scene]).map(i=>STORY[i]);
 left.innerHTML='<div class="context-title">故事回顧｜'+e(q.title)+'</div><h2>先回想剛才讀到什麼</h2>'+
 '<p>可以先不看故事，嘗試回答右側問題。需要時再查看原文。</p>'+
 '<div class="toolbar"><button onclick="reveal()">📖 查看相關故事段落</button>'+
 '<button onclick="speak((Array.isArray(QUESTIONS['+state.question+'].scenes)?QUESTIONS['+state.question+'].scenes:[QUESTIONS['+state.question+'].scene]).map(i=>STORY[i].text).join(\'。\'))">🔊 報讀相關段落</button></div>'+
 (seen?related.map(x=>'<div class="prompt"><strong>'+e(x.title)+'</strong><p>'+e(x.text)+'</p></div>').join(""):'<div class="feedback">目前沒有顯示原文。若忘記內容，可使用上方提示。</div>')+
 '<p class="small muted">查看故事不代表答錯，系統只記錄使用提示的次數。</p>';
 let html='<div class="feedback">這是進階練習，暫時可以先不做。建議教師陪同，需要時再練習口說或打字。</div><h2>第 '+(state.question+1)+' 題｜'+e(q.title)+'</h2><div class="prompt"><strong>'+e(q.prompt)+'</strong>'+
 '<div class="toolbar"><button onclick="speak(QUESTIONS['+state.question+'].prompt)">🔊 報讀題目</button><button onclick="stopSpeak()">停止報讀</button></div></div>'+
 '<div class="answer-modes" aria-label="選擇作答方式">'+
 '<button aria-pressed="'+(state.mode==="choice")+'" onclick="setMode(\'choice\')">選擇題</button>'+
 '<button aria-pressed="'+(state.mode==="speech")+'" onclick="setMode(\'speech\')">口說回答</button>'+
 '<button aria-pressed="'+(state.mode==="typing")+'" onclick="setMode(\'typing\')">打字回答</button></div>';
 if(state.mode==="choice"){
  html+=q.choices.map((v,i)=>'<div class="option"><button class="choose" onclick="pick('+i+')">'+(i+1)+'．'+e(v)+'</button>'+
  '<button class="readopt" aria-label="報讀選項 '+(i+1)+'" onclick="speak(QUESTIONS['+state.question+'].choices['+i+'])">🔊</button></div>').join("");
  if(a.choiceCorrect)html+='<div class="feedback good">這題已選到符合故事的答案。'+e(q.help)+'</div>';
  else if(a.choiceTried)html+='<div class="feedback warn">這個選項與故事內容不完全相符。請重新讀題或查看相關段落。</div>';
 }
 if(state.mode==="typing"){
  if(q.stems){
   html+='<label>依照提示填入關鍵資訊</label>'+renderScaffoldInputs(q,a);
   if(a.typed&&!Array.isArray(a.scaffoldParts))html+='<div class="feedback">先前儲存的回答：'+e(a.typed)+'</div>';
  }else{
   html+='<label for="typedAnswer">回答上面的問題</label>'+
   '<textarea id="typedAnswer" autocomplete="off" placeholder="找出相關資訊，輸入一至兩句回答" oninput="typeChange(this.value)">'+e(a.typed||"")+'</textarea>';
  }
  html+='<div class="toolbar"><button class="primary" onclick="submitTyped()">儲存這次打字回答</button>'+
  '<button onclick="speak(QUESTIONS['+state.question+'].check)">🔊 聽檢查提示</button></div>';
  if(a.typingSubmitted)html+='<div class="feedback good">文字已儲存，尚未由教師評閱。請自行檢查：'+e(q.check)+'</div>';
 }
 if(state.mode==="speech"){
  if(q.stems)html+=renderScaffoldSpeech(q);
  else html+='<p class="small">先回答上面的問題，可用一至兩句話。錄音後可回聽。</p>';
  html+='<div class="toolbar"><button id="recordButton" class="primary" onclick="toggleRecord()">🎙️ 開始錄音</button>'+
  '<button id="recognizeButton" onclick="startRecognize()" '+(!recognitionSupported()?"disabled":"")+'>🎤 語音轉文字</button></div>'+
  '<div id="recordStatus" class="feedback" role="status">錄音需允許麥克風權限。語音轉文字不一定支援 iPad 瀏覽器。</div>'+
  '<div id="audioResult" data-id="'+q.id+'"></div><label for="speechText">口說內容的文字紀錄（選填）</label>'+
  '<textarea id="speechText" placeholder="語音辨識結果或使用鍵盤上的麥克風輸入" oninput="speechTextChange(this.value)">'+e(a.spokenText||"")+'</textarea>'+
  '<div class="toolbar"><button class="primary" onclick="submitSpeech()">確認已完成口說練習</button>'+
  '<button onclick="speak(QUESTIONS['+state.question+'].check)">🔊 聽檢查提示</button></div>';
  if(a.speechSubmitted)html+='<div class="feedback good">已記錄口說練習完成；錄音及語音辨識不等於口語能力評分。請自行檢查：'+e(q.check)+'</div>';
 }
 html+='<div class="footer"><button onclick="changeQ(-1)" '+(state.question===0?"disabled":"")+'>上一題</button>'+
 '<button class="primary" onclick="'+(state.question===5?"showSummary()":"changeQ(1)")+'">'+(state.question===5?"查看紀錄":"下一題")+'</button></div>';
 right.innerHTML=html;
 if(state.mode==="speech")loadAudio(q.id);
}

function pick(i){const q=QUESTIONS[state.question],a=answerFor(q.id);a.choiceAttempts=(a.choiceAttempts||0)+1;a.choiceTried=true;if(i===q.answer)a.choiceCorrect=true;save();render()}
function typeChange(v){const q=QUESTIONS[state.question],a=answerFor(q.id);a.typed=String(v).slice(0,1200);a.typingSubmitted=false;save()}
function scaffoldChange(i,v){
 const q=QUESTIONS[state.question],a=answerFor(q.id);
 if(!Array.isArray(q.stems)||!q.stems[i])return;
 if(!Array.isArray(a.scaffoldParts))a.scaffoldParts=q.stems.map(()=>"");
 a.scaffoldParts[i]=String(v).slice(0,150);
 a.typingSubmitted=false;
 save();
}
function submitTyped(){
 const q=QUESTIONS[state.question],a=answerFor(q.id);
 if(Array.isArray(q.stems)){
  const parts=q.stems.map((_,i)=>(document.getElementById("scaffoldPart"+i)?.value||"").trim());
  if(parts.some(v=>v.length===0)){alert("請先依照提示完成每一個空格。每格填一項關鍵資訊即可。");return}
  a.scaffoldParts=parts;
  a.typed=q.stems.map((step,i)=>step.before+parts[i]+step.after).join("\n");
  a.typingSubmitted=true;save();render();return;
 }
 const v=document.getElementById("typedAnswer").value.trim();
 if(v.length<2){alert("請先回答上面的問題。");return}
 a.typed=v;a.typingSubmitted=true;save();render();
}
function speechTextChange(v){const q=QUESTIONS[state.question],a=answerFor(q.id);a.spokenText=String(v).slice(0,1200);save()}
function submitSpeech(){const q=QUESTIONS[state.question],a=answerFor(q.id);if(!a.hasAudio&&!(a.spokenText||"").trim()){alert("請先錄下口說，或使用語音輸入文字。");return}a.speechSubmitted=true;save();render()}
function renderSummary(left,right){
 const done=countMicroDone(),advanced=countDone(),first=MICRO.filter(m=>microAnswer(m.id).firstCorrect===true).length;
 const replay=MICRO.reduce((sum,m)=>sum+(microAnswer(m.id).audioRequests||0),0);
 const views=MICRO.filter(m=>!!microAnswer(m.id).textViewed).length;
 left.innerHTML='<h2>短句練習紀錄</h2><p>二選一已答對 '+done+'／'+MICRO.length+' 題。</p>'+
 '<progress value="'+done+'" max="'+MICRO.length+'"></progress>'+
 '<p>第一次就選對：'+first+' 題；報讀按鈕使用 '+replay+' 次；查看文字提示 '+views+' 題。</p>'+
 '<p class="muted">報讀按鈕只記錄操作次數，不代表確實聽完。二選一答對也不代表能獨立重述。</p>'+
 '<div class="toolbar"><button class="primary" onclick="showReading()">繼續短句練習</button>'+
 '<button onclick="showQuestions()">進階問答（選做）</button></div>'+
 '<p class="small muted">原有進階問答紀錄保留：已完成 '+advanced+'／6 題；目前不需要完成。</p>';
 right.innerHTML='<h2>每句的練習情況</h2>'+
 MICRO.map((m,i)=>{const a=microAnswer(m.id);return '<div class="prompt" style="margin:0 0 8px">'+(i+1)+'．'+e(m.title)+
 '：'+(a.correct?'已答對':'未答對')+
 '<div class="small">首次：'+(a.firstCorrect===true?'答對':a.firstCorrect===false?'未答對':'未作答')+
 '；報讀 '+(a.audioRequests||0)+' 次；文字提示 '+(a.textViewed?'有':'無')+'</div></div>'}).join("")+
 '<div class="toolbar"><button class="primary" onclick="downloadSummary()">下載紀錄</button></div>'+
 '<p class="muted">資料保存在此裝置，不會自動傳送給教師。</p>';
}

function downloadSummary(){
 let lines=["大吉｜短句聽讀與二選一｜練習紀錄","下載時間："+new Date().toLocaleString("zh-TW"),
 "報讀按鈕次數不等於實際聆聽次數；二選一答對不代表能獨立重述。","","短句練習："];
 MICRO.forEach((m,i)=>{const a=microAnswer(m.id);lines.push((i+1)+"．"+m.question,
 "結果："+(a.correct?"已答對":"未答對"),"首次："+(a.firstCorrect===true?"答對":a.firstCorrect===false?"未答對":"未作答"),
 "報讀按鈕："+(a.audioRequests||0)+" 次","查看文字："+(a.textViewed?"是":"否"),"")});
 lines.push("進階題（選做）：");
 QUESTIONS.forEach((q,i)=>{const a=state.answers[q.id]||{};lines.push((i+1)+"．"+q.title,
 "選擇："+(a.choiceCorrect?"答對":a.choiceTried?"未答對":"未作答"),"打字："+(a.typed||"無"),
 "口說："+(a.speechSubmitted?"已完成":"未確認"),"口說文字："+(a.spokenText||"無"),
 "提示次數："+(a.hints||0),"")});
 const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="大吉_短句聽讀與故事問答紀錄.txt";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

let recorder=null,recorderStream=null,recordingId="",recordChunks=[],recordingBusy=false,recognizer=null;
let recordedUrls={};
function audioMime(){if(!window.MediaRecorder)return"";for(const t of ["audio/mp4","audio/webm;codecs=opus","audio/webm"]){if(typeof MediaRecorder.isTypeSupported==="function"&&MediaRecorder.isTypeSupported(t))return t}return""}
async function toggleRecord(){
 if(recorder&&recorder.state==="recording"){recorder.stop();return}
 if(recordingBusy)return;
 const q=QUESTIONS[state.question],id=q.id,st=document.getElementById("recordStatus"),bt=document.getElementById("recordButton");
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){if(st)st.textContent="此瀏覽器不支援頁內錄音。可改用打字欄位與 iPad 鍵盤的語音輸入。";return}
 recordingBusy=true;bt.disabled=true;
 try{
  stopSpeak();stopRecognize();
  recorderStream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=audioMime();recorder=mt?new MediaRecorder(recorderStream,{mimeType:mt}):new MediaRecorder(recorderStream);
  recordingId=id;recordChunks=[];
  recorder.ondataavailable=ev=>{if(ev.data&&ev.data.size)recordChunks.push(ev.data)};
  recorder.onerror=()=>{if(st)st.textContent="錄音發生錯誤，請再試一次。"};
  recorder.onstop=async()=>{
   const blob=new Blob(recordChunks,{type:recorder.mimeType||mt||"audio/mp4"});
   if(recorderStream){recorderStream.getTracks().forEach(t=>t.stop());recorderStream=null}
   recorder=null;recordingBusy=false;
   if(blob.size){audioMap[id]=blob;const a=answerFor(id);a.hasAudio=true;save();await putAudio(id,blob);if(state.page==="questions"&&QUESTIONS[state.question].id===id){loadAudio(id);let rs=document.getElementById("recordStatus");if(rs)rs.textContent="錄音完成。請播放回聽，並確認是否說清楚。"}}
   else{let rs=document.getElementById("recordStatus");if(rs)rs.textContent="沒有取得有效錄音，請重試。"}
   const button=document.getElementById("recordButton");if(button){button.disabled=false;button.textContent="🎙️ 再錄一次"}
  };
  recorder.start();recordingBusy=false;bt.disabled=false;bt.textContent="■ 停止錄音";if(st)st.textContent="錄音中。請說完後按「停止錄音」。";
 }catch(err){recordingBusy=false;if(recorderStream){recorderStream.getTracks().forEach(t=>t.stop());recorderStream=null}bt.disabled=false;if(st)st.textContent="無法使用麥克風。請檢查權限，或使用鍵盤語音輸入。"}
}
function stopCapture(){
 if(recorder&&recorder.state==="recording"){try{recorder.stop()}catch(e){}}
 stopRecognize();
}
function recognitionSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function stopRecognize(){if(recognizer){try{recognizer.abort()}catch(e){}recognizer=null}}
function startRecognize(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 const st=document.getElementById("recordStatus");
 if(!R){if(st)st.textContent="本瀏覽器不支援語音轉文字，可使用頁內錄音或鍵盤語音輸入。";return}
 if(recorder&&recorder.state==="recording"){if(st)st.textContent="請先結束錄音，再開始語音轉文字。";return}
 stopSpeak();stopRecognize();const id=QUESTIONS[state.question].id;let r;
 try{r=new R();r.lang="zh-TW";r.interimResults=false;r.continuous=false;r.maxAlternatives=1;recognizer=r;
 r.onresult=ev=>{let words=Array.from(ev.results).map(x=>x[0]&&x[0].transcript||"").join("");const a=answerFor(id);a.spokenText=((a.spokenText||"")+" "+words).trim();save();const tx=document.getElementById("speechText");if(tx&&QUESTIONS[state.question].id===id)tx.value=a.spokenText;if(st)st.textContent="已取得語音辨識文字。請自行核對是否與原本說的話相同。"};
 r.onerror=ev=>{if(st)st.textContent="語音辨識無法完成："+String(ev.error||"裝置或權限限制")+"。可改用頁內錄音。"};
 r.onend=()=>{if(recognizer===r)recognizer=null};r.start();if(st)st.textContent="正在聆聽口說回答……語音辨識結果僅供參考。";
 }catch(err){if(st)st.textContent="此瀏覽器目前不能進行語音辨識。請改用錄音或鍵盤輸入。"}
}
const audioMap={};let audioDbPromise=null;
function dbOpen(){if(!window.indexedDB)return Promise.reject(Error("IndexedDB not available"));if(!audioDbPromise)audioDbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open("life-da-ji-story-audio-v1",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("clips"))r.result.createObjectStore("clips")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return audioDbPromise}
async function putAudio(id,blob){try{const db=await dbOpen();await new Promise((resolve,reject)=>{const tx=db.transaction("clips","readwrite");tx.objectStore("clips").put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){const st=document.getElementById("recordStatus");if(st)st.textContent="錄音可在本次開啟時回聽，但此裝置無法永久儲存；請立即下載音檔。"}}
async function getAudio(id){try{const db=await dbOpen();return await new Promise((resolve,reject)=>{const tx=db.transaction("clips","readonly"),r=tx.objectStore("clips").get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}}
async function loadAudio(id){
 const target=document.getElementById("audioResult");if(!target||target.dataset.id!==id)return;
 const blob=audioMap[id]||await getAudio(id);
 if(!blob||!target.isConnected||target.dataset.id!==id)return;
 audioMap[id]=blob;if(recordedUrls[id])URL.revokeObjectURL(recordedUrls[id]);recordedUrls[id]=URL.createObjectURL(blob);
 target.innerHTML='<label>回聽剛才的口說</label><audio controls preload="none" src="'+recordedUrls[id]+'"></audio><a href="'+recordedUrls[id]+'" download="大吉_口說練習_'+id+(blob.type.includes("mp4")?".m4a":".webm")+'">下載這一題的錄音檔</a>';
}
render();
