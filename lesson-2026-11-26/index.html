<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>第 2 堂｜聽清楚、說清楚</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/bpmf-iansui@5.3.1/index.css" rel="stylesheet">
<style>
/* 大吉學習站 第 2 堂：量詞、故事一（新題目）、故事二。語音輸入作答，網頁把關進度 */
:root{color-scheme:light;--bg:#fbfaf7;--ink:#1f2430;--muted:#5b6170;--left:#e3eef7;--line:#d5dbe3;--accent:#e8772e;--accent-d:#c45f1d;--ok:#2f7d5b;--help:#3a6fb0;--warn:#fff4e5;--bad:#b3261e}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.5 "Bpmf Iansui","Noto Sans TC","PingFang TC",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{touch-action:manipulation;-webkit-touch-callout:none;font:inherit;color:inherit;border:0;cursor:pointer;border-radius:16px;min-height:56px;padding:10px 22px}
button:focus-visible{outline:4px solid var(--help);outline-offset:2px}
.app{display:grid;grid-template-rows:64px 1fr 96px;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
.tag{font-size:16px;background:var(--warn);color:#8a4b10;padding:4px 12px;border-radius:999px}
.title{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:380px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}.dots i.pd{background:#9fb8cf}
.tbtn{font-family:"Noto Sans TC","PingFang TC",sans-serif;min-height:44px;font-size:17px;background:#eef1f5;color:var(--muted);padding:6px 16px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.left{background:var(--left);padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;overflow:auto;text-align:center}
.right{padding:24px 28px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.q{font-size:29px;line-height:1.4;-webkit-text-stroke:.3px var(--ink)}
.sub{color:var(--muted);font-size:20px}
.say{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px 18px;font-size:23px}
.bottom{display:flex;gap:12px;align-items:center;padding:0 20px;border-top:1px solid var(--line);background:#fff}
.big{font-size:22px;min-height:68px;padding:0 22px}
.done{background:var(--accent);color:#fff;font-size:24px;padding:0 30px}
.done.off{background:#e9d3c3;color:#fff}
.helpb{background:#e7effa;color:var(--help)}
.again,.back{background:#eef1f5}
.spacer{flex:1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{background:#fff;border:2px solid var(--line);font-size:23px;min-height:64px}
.opt.sel{border-color:var(--accent);background:#fff3ea}
.word{font-size:64px;background:#fff;border-radius:22px;padding:18px 40px}
.scene{font-size:24px;background:#fff;border-radius:16px;padding:12px 20px;max-width:460px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px;width:100%;max-width:440px;text-align:left}
.list li{background:#fff;border-radius:16px;padding:12px 18px;display:flex;gap:14px;align-items:center;font-size:24px}
.list li b{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-size:20px;font-weight:400}
/* 故事播放器 */
.player{width:100%;max-width:470px;display:grid;gap:10px}
.pctl{display:flex;gap:10px}
.pctl button{background:#fff;font-size:22px;min-height:62px;flex:1}
.pctl button.on{background:var(--ink);color:#fff}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chip{background:#fff;border:2px solid var(--line);font-size:21px;min-height:58px;padding:6px}
.chip.play{border-color:var(--accent);background:#fff3ea}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.hint{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.stext{background:#fff;border-radius:14px;padding:10px 14px;text-align:left;font-size:19px;line-height:1.6}
.stext span.play{background:#ffe2cc}
/* 語音輸入 */
.mic{background:var(--help);color:#fff;font-size:24px;min-height:74px;display:flex;align-items:center;gap:12px;align-self:flex-start;padding:0 30px}
.mic.on{background:#d64545}
.mic svg{width:28px;height:28px}
.heard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 18px;font-size:26px;min-height:64px}
.heard.ok{border-color:var(--ok)}.heard.no{border-color:var(--accent)}
.heard small{display:block;font-size:17px;color:var(--muted)}
.kbd{display:flex;gap:10px}.kbd input{flex:1;font:inherit;font-size:22px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;-webkit-user-select:text;user-select:text}
.msg{font-size:21px;border-radius:14px;padding:10px 16px;background:#fff3ea;color:#8a4b10}
.msg.good{background:#e6f4ec;color:var(--ok)}
.banner{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--help);color:#fff;padding:12px 26px;border-radius:999px;font-size:21px;display:none;z-index:20;max-width:90vw;text-align:center}
/* 教師面板 */
.panel{font-family:"Noto Sans TC","PingFang TC",sans-serif;position:fixed;inset:0 0 0 auto;width:min(480px,94vw);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .2s;z-index:30;display:flex;flex-direction:column;font-size:17px}
.panel.open{transform:none}
@media(prefers-reduced-motion:reduce){.panel{transition:none}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700}
.pb{padding:12px 16px;overflow:auto;display:grid;gap:14px;align-content:start;-webkit-user-select:text;user-select:text}
.pb h4{margin:0 0 6px;font-size:16px;color:var(--muted)}
.pb button{min-height:44px;font-size:16px;background:#eef1f5;padding:6px 12px;border-radius:12px}
.pb .pri{background:var(--accent);color:#fff}
.pb select,.pb input[type=text],.pb textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.pb textarea{min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg button.on{background:var(--ink);color:#fff}
.ans{background:#f3f6f9;border-radius:10px;padding:8px 10px;font-size:16px;line-height:1.55}
.log{font-size:14px;color:var(--muted);max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:40}
.modal .box{font-family:"Noto Sans TC","PingFang TC",sans-serif;background:#fff;border-radius:18px;padding:22px;max-width:420px;font-size:19px;display:grid;gap:14px}
@media(max-width:820px){.main{grid-template-columns:minmax(0,1fr)}.big{font-size:19px;padding:0 14px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="tag">練習用</span>
    <div class="title" id="title"></div>
    <div class="dots" id="dots"></div>
    <button class="tbtn" id="tbtn">老師</button>
  </header>
  <main class="main">
    <section class="left" id="left"></section>
    <section class="right" id="right"></section>
  </main>
  <footer class="bottom">
    <button class="big back" id="bBack">上一題</button>
    <button class="big again" id="bAgain">再聽一次題目</button>
    <button class="big helpb" id="bHelp">我需要幫忙</button>
    <span class="spacer"></span>
    <button class="big done" id="bDone">我做好了</button>
  </footer>
</div>
<div class="banner" id="banner"></div>

<aside class="panel" id="panel" aria-label="教師面板">
  <div class="ph"><span>教師面板</span><div class="row"><button class="tbtn" id="pLock">上鎖並關閉</button><button class="tbtn" id="pClose">關閉</button></div></div>
  <div class="pb">
    <div><h4>跳到</h4><select id="pJump"></select></div>
    <div id="pCtx"></div>
    <div><h4>這個任務的提示程度</h4><div class="row seg" id="pLevel"></div></div>
    <div><h4>故事文字（給老師核對；學生也看得到）</h4><button id="pText"></button></div>
    <div><h4>備註（只存在匯出檔，重新整理會消失）</h4><textarea id="pNote"></textarea></div>
    <div><h4>本堂紀錄</h4><div class="log" id="pLog"></div></div>
    <div><h4>角色名稱</h4><div class="row"><input type="text" id="pName" style="flex:1"><button id="pNameSave">儲存</button></div></div>
    <div class="row"><button class="pri" id="pExport">匯出紀錄</button><button id="pClear">清除 iPad 上的紀錄</button></div>
  </div>
</aside>
<div class="modal" id="pin"><div class="box" style="text-align:center"><div id="pinMsg"></div><div id="pinDots" style="font-size:34px;letter-spacing:12px;min-height:44px"></div><div id="pinPad" style="display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center"></div><div class="row" style="justify-content:center"><button id="pinCancel" style="background:#eef1f5;min-height:48px">取消</button></div></div></div>
<div class="modal" id="modal"><div class="box"><div id="mText"></div><div class="row"><button id="mNo" style="background:#eef1f5;min-height:48px">取消</button><button id="mYes" style="background:#b3261e;color:#fff;min-height:48px">確定清除</button></div></div></div>

<script>
{
const LESSON='lesson02';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const now=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`};
const lsGet=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let NAME=lsGet('daji-name','大吉');
const nm=s=>String(s).split('NAME').join(NAME);

/* ---------- 教材（虛構的練習內容） ---------- */
const STORY={
 A:['星期六早上九點，NAME和媽媽一起坐公車去市場。','他們先到水果攤，買了三顆蘋果和一串香蕉。','接著，他們去麵包店，媽媽買了一條吐司。','NAME想買一瓶巧克力牛奶，可是店裡已經賣完了。','NAME有一點失望，媽媽說：「我們下次再來買。」','回家的路上，開始下雨了，他們沒有帶傘。','他們跑到便利商店，買了一把藍色的雨傘。','回到家，NAME覺得很累，但是很開心。'],
 B:['星期三下午四點，NAME放學後走路去圖書館。','他在門口遇到同學小明。','他們一起借了兩本恐龍的書。','NAME想借第三本，可是一個人只能借兩本。','走出圖書館的時候，NAME發現他的水壺不見了。','小明陪他回到座位，在椅子下面找到了水壺。','NAME跟小明說謝謝，覺得鬆了一口氣。']};
const MW=['串','顆','條','瓶','把','本','個'];
const MWQ=[['香蕉','一串香蕉','串'],['蘋果','三顆蘋果','顆'],['吐司','一條吐司','條'],['牛奶','一瓶牛奶','瓶'],['雨傘','一把雨傘','把'],['書','兩本書','本'],['水壺','一個水壺','個']];
const QA=[
 {q:'他們星期幾去市場？',ans:'星期六',keys:[['星期六','禮拜六','週六','周六']],opts:['星期六','星期三','星期日','星期一'],src:[1]},
 {q:'他們第一個去哪裡買東西？',ans:'水果攤',keys:[['水果']],opts:['水果攤','麵包店','便利商店','圖書館'],src:[2],extra:['蘋果','香蕉'],hint:'題目問的是「哪裡」，要說地方喔。'},
 {q:'買完水果以後，他們去哪裡？',ans:'麵包店',keys:[['麵包','面包']],opts:['麵包店','水果攤','便利商店','回家'],src:[3],extra:['吐司'],hint:'題目問的是「哪裡」，要說地方喔。'},
 {q:'媽媽在麵包店買了什麼？',ans:'一條吐司',keys:[['吐司','土司']],opts:['一條吐司','一瓶牛奶','三顆蘋果','一把雨傘'],src:[3]},
 {q:'下雨了，他們在哪裡買雨傘？',ans:'便利商店',keys:[['便利','超商']],opts:['便利商店','麵包店','水果攤','市場'],src:[7],extra:['藍色','藍'],hint:'題目問的是「哪裡」，要說地方喔。'},
 {q:'他們買的雨傘是什麼顏色？',ans:'藍色',keys:[['藍']],opts:['藍色','紅色','黃色','白色'],src:[7]},
 {q:'回到家，NAME有哪兩個感覺？',ans:'很累，也很開心',keys:[['累'],['開心','高興','快樂']],opts:['很累，也很開心','很累，也很失望','很開心，也很害怕','很生氣，也很累'],src:[8],two:true}];
const QB=[
 {q:'NAME放學後去哪裡？',ans:'圖書館',keys:[['圖書館']],opts:['圖書館','市場','便利商店','學校'],src:[1]},
 {q:'他在門口遇到誰？',ans:'小明',keys:[['小明']],opts:['小明','媽媽','老師','小美'],src:[2]},
 {q:'他們一起借了幾本書？',ans:'兩本',keys:[['兩本','2本','二本','两本']],opts:['兩本','一本','三本','四本'],src:[3],extra:['恐龍'],hint:'題目只問「幾本」喔。'},
 {q:'NAME為什麼不能借第三本？',ans:'一個人只能借兩本',keys:[['只能','兩本','2本','两本']],opts:['一個人只能借兩本','圖書館關門了','他沒有帶借書證','小明不讓他借'],src:[4]},
 {q:'什麼東西不見了？',ans:'水壺',keys:[['水壺','水瓶','水杯']],opts:['水壺','書','雨傘','書包'],src:[5]},
 {q:'水壺最後在哪裡找到？',ans:'椅子下面',keys:[['椅子']],opts:['椅子下面','桌子上面','圖書館門口','書包裡面'],src:[6],extra:['小明'],hint:'題目問的是「在哪裡」喔。'}];

/* ---------- 步驟 ---------- */
const S=[];
S.push({key:'flow',task:'開場',title:'今天要做的事',speak:'今天要做三件事。第一，量詞練習。第二，再聽故事一。第三，聽故事二。記得：先聽完，再回答。回答的時候，慢慢說，說清楚。'});
MWQ.forEach((m,i)=>S.push({key:'mw'+(i+1),task:'量詞',title:`量詞 ${i+1}／${MWQ.length}`,kind:'mw',m}));
S.push({key:'listenA',task:'故事一：聽',title:'故事一：聽故事',kind:'listen',story:'A',speak:'再聽一次故事一。每一句都要聽過。聽完了，按我做好了。'});
QA.forEach((q,i)=>S.push({key:'a'+(i+1),task:'故事一：找答案',title:`故事一 第 ${i+1}／${QA.length} 題`,kind:'q',story:'A',q}));
S.push({key:'listenB',task:'故事二：聽',title:'故事二：聽故事',kind:'listen',story:'B',speak:'這是新的故事，故事二。每一句都要聽過。聽完了，按我做好了。'});
QB.forEach((q,i)=>S.push({key:'b'+(i+1),task:'故事二：找答案',title:`故事二 第 ${i+1}／${QB.length} 題`,kind:'q',story:'B',q}));
S.push({key:'mood',task:'收尾',title:'今天的心情',kind:'mood',speak:'今天上完課，你覺得怎麼樣？為什麼？'});
S.push({key:'bye',task:'結束話題',title:'下課了',kind:'bye',speak:'上課時間到了，你要怎麼跟老師說？'});
S.push({key:'end',task:'收尾',title:'完成了',speak:'今天的課完成了，謝謝你！'});
const st={};S.forEach(s=>st[s.key]={tries:[],heard:{},phase:'say'});
let cur=0;const levels={},notes={};let showText=false;

/* ---------- 儲存（只存在這台 iPad） ---------- */
let db=null;const mem=[];
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('daji-learning',1);r.onupgradeneeded=()=>{const d=r.result;['events','audio'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function put(obj){if(!db){mem.push(obj);return}try{db.transaction('events','readwrite').objectStore('events').add(obj)}catch(e){mem.push(obj)}}
function allEv(){return new Promise(res=>{if(!db)return res(mem.slice());try{const q=db.transaction('events').objectStore('events').getAll();q.onsuccess=()=>res(q.result.concat(mem));q.onerror=()=>res(mem.slice())}catch(e){res(mem.slice())}})}
function clearAll(){mem.length=0;return new Promise(res=>{if(!db)return res();try{const t=db.transaction(['events','audio'],'readwrite');t.objectStore('events').clear();t.objectStore('audio').clear();t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function log(type,data){put({lesson:LESSON,ts:now(),step:S[cur].key,task:S[cur].task,type,data:data||{}});if($('panel').classList.contains('open'))renderLog()}

/* ---------- 注音破音字修正（Bpmf Iansui 的 IVS） ---------- */
const BP=[['覺得','覺得\u{E01E3}'],['感覺','感覺\u{E01E3}']];
function bpFix(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let t=n.nodeValue,o=t;for(const [a,b] of BP)t=t.split(a).join(b);if(t!==o)n.nodeValue=t}}

/* ---------- 語音朗讀：整段、分句、暫停 ---------- */
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/zh/i.test(x.lang))||null}catch(e){}}
if(window.speechSynthesis){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
const P={idx:-1,paused:false,token:0,list:[],k:0,story:null};
function sayOne(text,onend){if(!window.speechSynthesis){onend&&onend();return}try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.85;if(voice)u.voice=voice;u.onend=()=>onend&&onend();u.onerror=()=>onend&&onend();speechSynthesis.speak(u)}catch(e){onend&&onend()}}
function stopAll(){P.token++;P.idx=-1;P.paused=false;try{speechSynthesis.cancel()}catch(e){}markPlay()}
function speak(t){stopAll();if(t)sayOne(nm(t))}
function playStory(story,list){stopAll();const tk=P.token;P.story=story;P.list=list;P.k=0;run(tk)}
function run(tk){if(tk!==P.token)return;if(P.k>=P.list.length){P.idx=-1;markPlay();return}P.idx=P.list[P.k];markPlay();const x=st[S[cur].key];x.heard[P.idx]=(x.heard[P.idx]||0)+1;x.replayed=true;setTimeout(refresh,0);
 sayOne(nm(STORY[P.story][P.idx-1]),()=>{if(tk!==P.token||P.paused)return;P.k++;run(tk)})}
function pause(){if(P.idx<0)return;if(!P.paused){P.paused=true;P.token++;try{speechSynthesis.cancel()}catch(e){}log('暫停',{句:P.idx})}else{P.paused=false;log('繼續',{句:P.idx});run(P.token)}markPlay()}
function markPlay(){document.querySelectorAll('[data-sent]').forEach(b=>b.classList.toggle('play',+b.dataset.sent===P.idx));document.querySelectorAll('.stext span').forEach(s=>s.classList.toggle('play',+s.dataset.i===P.idx));const pb=$('pauseBtn');if(pb){pb.textContent=P.paused?'繼續':'暫停';pb.classList.toggle('on',P.paused)}}
function player(story){const arr=STORY[story];
 return `<div class="player"><div class="scene">${story==='A'?'故事一':'故事二'}</div><div class="pctl"><button data-all="${story}">聽整個故事</button><button id="pauseBtn">暫停</button></div><div class="chips">${arr.map((_,i)=>`<button class="chip" data-sent="${i+1}" data-story="${story}">第 ${i+1} 句</button>`).join('')}</div>${showText?`<div class="stext">${arr.map((t,i)=>`<span data-i="${i+1}">${i+1}. ${esc(nm(t))}</span>`).join('<br>')}</div>`:''}</div>`}

/* ---------- 語音輸入（說完會自動停止） ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let srObj=null,srOn=false,srLive='',srFail=!SR;
function micStart(){if(srOn){try{srObj.stop()}catch(e){}return}if(!SR){srFail=true;render();return}
 stopAll();srLive='';const r=new SR();srObj=r;r.lang='zh-TW';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
 r.onresult=e=>{let t='';for(const res of e.results)t+=res[0].transcript;srLive=t;const h=$('heardTxt');if(h)h.textContent=t};
 r.onerror=e=>{log('語音輸入錯誤',{原因:e.error});if(e.error!=='no-speech'&&e.error!=='aborted'){srFail=true;note('語音輸入沒有反應，改用鍵盤上的麥克風說。')}else if(e.error==='no-speech'){note('沒有聽到聲音，再按一次，大聲一點說。')}};
 r.onend=()=>{srOn=false;const t=srLive.trim();if(t)addTry(t,'語音');else render()};
 try{r.start();srOn=true;log('開始說',{});render()}catch(e){srFail=true;render()}}
function addTry(t,via){const s=S[cur],x=st[s.key];x.tries.push({text:t,via,ts:now()});log('說出答案',{文字:t,方式:via,階段:x.phase});x.msg='';render()}
const micIcon='<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
function micBlock(label){const x=st[S[cur].key];const last=x.tries.length?x.tries[x.tries.length-1]:null;
 let h=`<button class="mic ${srOn?'on':''}" data-mic="1">${micIcon}${srOn?'說完了':(label||'按這裡，說答案')}</button>`;
 if(srFail)h+=`<div class="sub">請點下面的格子，按鍵盤上的麥克風說，說完按「送出」。</div><div class="kbd"><input id="kbdIn" type="text" autocomplete="off"><button class="opt" data-kbd="1" style="min-height:52px">送出</button></div>`;
 h+=`<div class="heard ${x.lastOk===true?'ok':x.lastOk===false?'no':''}"><small>我說的是：</small><span id="heardTxt">${srOn?esc(srLive):last?esc(last.text):''}</span></div>`;
 h+=`<div class="sub">跟你想說的不一樣？說慢一點，再按一次。</div>`;return h}

/* ---------- 判斷答案 ---------- */
const clean=t=>String(t).replace(/[\s，。、！？,.!?「」]/g,'');
function judge(q,t){t=clean(t);const hit=q.keys.map(g=>g.some(k=>t.includes(k)));return {ok:hit.every(Boolean),part:hit.some(Boolean)&&!hit.every(Boolean),extra:(q.extra||[]).some(k=>t.includes(k))}}

/* ---------- 畫面 ---------- */
function render(){
 const s=S[cur],x=st[s.key];$('title').textContent=s.title;
 $('dots').innerHTML=S.map((_,i)=>`<i class="${i===cur?'on':i<cur?'pd':''}"></i>`).join('');
 let L='',R='';
 if(s.key==='flow'){L=`<ul class="list"><li><b>1</b>量詞練習</li><li><b>2</b>再聽故事一</li><li><b>3</b>聽故事二</li></ul>`;
  R=`<div class="q">今天要做三件事</div><div class="say">先聽完，再回答。<br>慢慢說，說清楚。</div><div class="sub">每一題做完，「我做好了」才會變亮。</div>`}
 else if(s.kind==='mw'){const m=s.m;
  L=`<div class="word">${esc(m[0])}</div><div class="sub">要怎麼說？</div>`;
  R=`<div class="card q" style="background:#fff;border-radius:18px;padding:14px 20px;border:2px solid var(--line)">${m[1].slice(0,1)}（　）${esc(m[0])}</div>`;
  if(x.phase==='say'||x.phase==='say2'){R+=`<div class="sub">${x.phase==='say'?`把整個說出來，例如「一（　）${esc(m[0])}」。`:'選好了，再把整個說一次。'}</div>`+micBlock(x.phase==='say2'?'再說一次':null)}
  if(x.phase==='opt'||x.phase==='say2'){if(!x.shown)x.shown=shuffle([m[2]].concat(shuffle(MW.filter(w=>w!==m[2])).slice(0,3)));R+=`<div class="opts">${x.shown.map(o=>`<button class="opt ${x.choice===o?'sel':''}" data-opt="${o}" ${x.phase==='say2'?'disabled':''}>${m[1].slice(0,1)}${o}${esc(m[0])}</button>`).join('')}</div>`}}
 else if(s.kind==='listen'){L=player(s.story);const h=x.heard;const left=STORY[s.story].filter((_,i)=>!h[i+1]).length;
  R=`<div class="q">仔細聽${s.story==='A'?'故事一':'故事二'}。</div><div class="sub">可以聽整個故事，也可以一句一句聽。</div><div class="say" id="leftCount">${left?`還有 ${left} 句沒聽過。`:'每一句都聽過了！'}</div>`}
 else if(s.kind==='q'){const q=s.q;L=player(s.story);
  R=`<div class="card" style="background:#fff;border-radius:18px;padding:14px 20px;border:2px solid var(--line)"><div class="q">${esc(nm(q.q))}</div></div>`;
  if(x.msg)R+=`<div class="msg ${x.msgGood?'good':''}">${esc(x.msg)}</div>`;
  if(x.phase==='say')R+=micBlock();
  else if(x.phase==='opt'){if(!x.shown)x.shown=shuffle(q.opts);R+=`<div class="opts">${x.shown.map(o=>`<button class="opt ${x.choice===o?'sel':''}" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
  else if(x.phase==='src'||x.phase==='srcshow'){R+=`<div class="say">哪一句可以聽到答案？<br><span class="sub">可以在左邊再聽一次，再點下面的句子。</span></div><div class="chips">${STORY[s.story].map((_,i)=>`<button class="chip ${x.src===i+1?'sel':''} ${x.phase==='srcshow'&&q.src.includes(i+1)?'hint':''}" data-src="${i+1}">第 ${i+1} 句</button>`).join('')}</div>`}
  else if(x.phase==='done')R+=`<div class="msg good">這一題完成了！</div>`}
 else if(s.kind==='mood'){if(!x.shown)x.shown=shuffle(['開心','累','難過','生氣','害怕','緊張']);
  L=`<div class="scene">今天上完課</div>`;R=`<div class="q">你現在覺得怎麼樣？</div><div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">${x.shown.map(o=>`<button class="opt ${x.choice===o?'sel':''}" data-opt="${o}">${o}</button>`).join('')}</div><div class="sub">再說說看：「我覺得（　），因為（　）。」</div>`+micBlock('按這裡，說原因')}
 else if(s.kind==='bye'){L=`<div class="scene">上課時間到了</div>`;R=`<div class="q">要怎麼跟老師說？</div>`+micBlock('按這裡，說說看')}
 else if(s.key==='end'){L=`<ul class="list"><li><b>✓</b>量詞練習</li><li><b>✓</b>再聽故事一</li><li><b>✓</b>聽故事二</li></ul>`;R=`<div class="q">今天的課完成了！</div><div class="sub">謝謝${esc(NAME)}。</div>`}
 $('left').innerHTML=L;$('right').innerHTML=R;['left','right','title'].forEach(id=>bpFix($(id)));markPlay();
 $('bDone').classList.toggle('off',!!need());$('bBack').disabled=cur===0;$('bBack').style.opacity=cur===0?.4:1;
 if($('panel').classList.contains('open'))renderPanel()}

function refresh(){const s=S[cur],x=st[s.key];$('bDone').classList.toggle('off',!!need());const lc=$('leftCount');if(lc&&s.story){const left=STORY[s.story].filter((_,i)=>!x.heard[i+1]).length;lc.textContent=left?`還有 ${left} 句沒聽過。`:'每一句都聽過了！'}}
/* 這一步還差什麼（回傳提醒文字；空字串代表可以往下） */
function need(){const s=S[cur],x=st[s.key];if(srOn)return '先說完喔。';
 if(x.phase==='done'||x.completed)return '';
 if(s.kind==='listen'){return STORY[s.story].some((_,i)=>!x.heard[i+1])?'每一句都要聽過喔。':''}
 if(s.kind==='mw'){if(x.phase==='opt')return x.choice?'':'先選一個喔。';return x.tries.length>(x.base||0)?'':'先按藍色按鈕，說出來喔。'}
 if(s.kind==='q'){if(x.phase==='say')return x.tries.length>(x.base||0)?(x.needReplay&&!x.replayed?'先在左邊再聽一次故事喔。':''):(x.needReplay&&!x.replayed?'先在左邊再聽一次故事，再說答案。':'先按藍色按鈕，說出答案喔。');
  if(x.phase==='opt')return x.choice?'':'先選一個喔。';if(x.phase==='src'||x.phase==='srcshow')return x.src?'':'先點一句喔。'}
 if(s.kind==='mood')return x.choice?'':'先選一個心情喔。';
 if(s.kind==='bye')return x.tries.length?'':'先說說看喔。';
 return ''}

/* 按「我做好了」 */
function next(){const s=S[cur],x=st[s.key];const n=need();if(n)return note(n);
 if(s.kind==='mw'&&!x.completed){const t=x.tries.length?x.tries[x.tries.length-1].text:'';
  if(x.phase==='say'){const ok=clean(t).includes(s.m[2]);x.lastOk=ok;log('量詞判斷',{說的:t,正確:ok});if(ok){x.completed=true;x.result='自己說對';note('說對了！');return advance()}x.phase='opt';x.base=x.tries.length;note('再想想看，選一個。');return render()}
  if(x.phase==='opt'){const ok=x.choice===s.m[2];log('量詞選擇',{選:x.choice,正確:ok});if(!ok){x.choice=null;note(`再聽聽看：${s.m[1]}。`);speak(s.m[1]);return render()}x.phase='say2';x.base=x.tries.length;note(`對！${s.m[1]}。再說一次。`);return render()}
  if(x.phase==='say2'){x.completed=true;x.result='用選項後說出';log('量詞再說一次',{說的:t,正確:clean(t).includes(s.m[2])});return advance()}}
 if(s.kind==='q'&&x.phase!=='done'){const q=s.q;
  if(x.phase==='say'){const t=x.tries[x.tries.length-1].text;const j=judge(q,t);x.lastOk=j.ok;x.wrong=x.wrong||0;
   log('自動判斷',{說的:t,正確:j.ok,部分:j.part,多回答:j.extra});
   if(j.ok){x.result=x.wrong?'重聽後說對':'自己說對';x.phase='src';x.msg=(j.extra&&q.hint)?'答對了！不過'+q.hint:'答對了！';x.msgGood=true;speak('哪一句可以聽到答案？');return render()}
   x.wrong++;x.base=x.tries.length;
   if(x.wrong===1){x.needReplay=true;x.replayed=false;x.msg=(j.extra&&q.hint)?q.hint+'再聽一次故事，再說一次。':(q.two&&j.part?'還有一個感覺喔。再聽一次故事，再說一次。':'再聽一次故事，找找看，再說一次。');x.msgGood=false;return render()}
   x.phase='opt';x.usedOpts=true;x.msg='沒關係，選一個看看。';x.msgGood=false;log('打開選項',{});return render()}
  if(x.phase==='opt'){const ok=x.choice===q.ans;log('選擇',{選項:x.choice,正確:ok});x.result=ok?'用選項答對':'用選項答錯';x.phase='src';x.msg=ok?'對了！':`答案是「${q.ans}」。`;x.msgGood=ok;speak('哪一句可以聽到答案？');return render()}
  if(x.phase==='src'){const ok=q.src.includes(x.src);x.srcTries=(x.srcTries||0)+1;log('證據句',{句:x.src,正確:ok,第幾次:x.srcTries});
   if(ok){x.srcResult=x.srcTries===1?'第一次就對':'第二次對';x.phase='done';x.msg='找到了！';x.msgGood=true;render();return setTimeout(advance,700)}
   if(x.srcTries===1){x.src=null;x.msg='不是這一句喔。再聽聽看，找找看。';x.msgGood=false;return render()}
   x.srcResult='老師提示';x.phase='srcshow';x.src=null;x.msg=`答案在第 ${q.src.join('、')} 句，聽聽看。`;x.msgGood=false;render();return playStory(s.story,q.src.slice())}
  if(x.phase==='srcshow'){x.phase='done';return advance()}}
 log('我做好了',{});if(s.key==='end')return note('今天的課完成了！');
 advance()}
function advance(){stopAll();if(cur<S.length-1){cur++;render();const s=S[cur];speak(s.kind==='q'?s.q.q:s.kind==='mw'?`${s.m[0]}，要怎麼說？`:s.speak)}}

/* ---------- 學生操作 ---------- */
function note(m){const b=$('banner');b.textContent=nm(m);bpFix(b);b.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>b.style.display='none',2600)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.closest('.panel')||t.closest('.modal'))return;const s=S[cur],x=st[s.key];
 if(t.dataset.mic){micStart();return}
 if(t.dataset.kbd){const v=($('kbdIn')||{}).value||'';if(v.trim())addTry(v.trim(),'鍵盤');return}
 if(t.dataset.all){log('聽整個故事',{});playStory(t.dataset.all,STORY[t.dataset.all].map((_,i)=>i+1));refresh();return}
 if(t.dataset.sent){log('聽一句',{句:+t.dataset.sent});playStory(t.dataset.story,[+t.dataset.sent]);refresh();return}
 if(t.id==='pauseBtn'){pause();return}
 if(t.dataset.opt){x.choice=t.dataset.opt;log('點選',{選:x.choice});render();return}
 if(t.dataset.src){x.src=+t.dataset.src;render();return}});

 if(s.kind==='mw')c=`<h4>正確說法</h4><div class="ans">${esc(s.m[1])}</div><h4 style="margin-top:8px">他說的</h4><div class="ans">${tries}</div><div class="ans" style="margin-top:6px">結果：${esc(x.result||'進行中')}</div><div class="row" style="margin-top:6px"><button data-pass="1">算他答對，放行</button></div>`;
 if(s.kind==='mood'||s.kind==='bye')c=`<h4>他說的</h4><div class="ans">${tries}</div>`;

 const row=(s)=>{const x=st[s.key];return {題目:s.kind==='mw'?s.m[1]:nm(s.q.q),標準答案:s.kind==='mw'?s.m[1]:s.q.ans,他說的:x.tries.map(t=>t.text),結果:x.result||'未完成',用了選項:!!x.usedOpts,選項:x.choice||'',證據句:x.srcResult||'',老師標記:x.mark||'',聽句次數:x.heard}};
 const out={課次:'第 2 堂｜聽清楚、說清楚',匯出時間:now(),摘要:{量詞:S.filter(s=>s.kind==='mw').map(row),故事一:S.filter(s=>s.kind==='q'&&s.story==='A').map(row),故事二:S.filter(s=>s.kind==='q'&&s.story==='B').map(row),今天的心情:{選:st.mood.choice||'',說:st.mood.tries.map(t=>t.text)},結束話題:st.bye.tries.map(t=>t.text)},提示程度:levels,備註:notes,紀錄:ev};
 const d=new Date();const fn=`lesson02_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();log('匯出紀錄',{檔名:fn})};

openDB();render();
